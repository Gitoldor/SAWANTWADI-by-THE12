<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0,user-scalable=no" />

<title>Communities & Feeds</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">


<style>

/* =====================================================
   RESET
===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;

  -webkit-tap-highlight-color:transparent;
}


html{
  background:#fcfcfc;
}


body{

  width:100%;
  min-height:100vh;

  background:#fcfcfc;
  color:#000;

  font-family:'Inter',
  -apple-system,
  BlinkMacSystemFont,
  sans-serif;

  overflow-y:auto;
  overflow-x:hidden;

  padding:24px 16px 48px;

  scrollbar-width:none;

}


body::-webkit-scrollbar{
  display:none;
}


/* =====================================================
   PAGE ENTER
===================================================== */

body{
  animation:
  pageEnter .55s
  cubic-bezier(.22,1,.36,1)
  both;
}


@keyframes pageEnter{

  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}


/* =====================================================
   HEADER
===================================================== */

.page-header{

  display:flex;

  align-items:center;

  gap:13px;

  margin-bottom:26px;

  animation:
  headerEnter .6s
  cubic-bezier(.22,1,.36,1)
  both;

}


@keyframes headerEnter{

  from{
    opacity:0;
    transform:
    translateY(-12px);
  }

  to{
    opacity:1;
    transform:
    translateY(0);
  }

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-btn{

  width:38px;
  height:38px;

  display:flex;

  align-items:center;
  justify-content:center;

  background:transparent;

  border:none;

  border-radius:50%;

  cursor:pointer;

  text-decoration:none;

  flex-shrink:0;

  transition:
  background .2s ease,
  transform .2s
  cubic-bezier(.22,1,.36,1);

}


.back-btn:hover{

  background:#f0f0f0;

  transform:
  translateX(-2px);

}


.back-btn:active{

  transform:
  scale(.86)
  translateX(-2px);

}


.back-btn svg{

  width:25px;
  height:25px;

  fill:none;

  stroke:#000;

  stroke-width:2.5;

  stroke-linecap:round;
  stroke-linejoin:round;

  transition:
  transform .2s
  cubic-bezier(.22,1,.36,1);

}


.back-btn:hover svg{

  transform:
  translateX(-2px);

}


/* =====================================================
   TITLE
===================================================== */

.main-title{

  font-size:2rem;

  font-weight:900;

  letter-spacing:-1px;

  color:#000;

  line-height:1;

}


/* =====================================================
   SECTION
===================================================== */

.section-header{

  display:flex;

  align-items:flex-end;

  justify-content:space-between;

  margin-top:24px;

  margin-bottom:15px;

  gap:8px;

  opacity:0;

  animation:
  sectionEnter .55s
  cubic-bezier(.22,1,.36,1)
  forwards;

}


.section-header:nth-of-type(2){
  animation-delay:.08s;
}


.section-header:nth-of-type(3){
  animation-delay:.22s;
}


@keyframes sectionEnter{

  from{

    opacity:0;

    transform:
    translateY(8px);

  }

  to{

    opacity:1;

    transform:
    translateY(0);

  }

}


/* =====================================================
   SECTION LABEL
===================================================== */

.section-label{

  font-size:.92rem;

  font-weight:700;

  color:#96969b;

  letter-spacing:-.1px;

  line-height:1.1;

}


/* =====================================================
   SEE ALL
===================================================== */

.see-all-btn{

  font-size:.88rem;

  font-weight:700;

  color:#8e8e93;

  text-decoration:none;

  white-space:nowrap;

  flex-shrink:0;

  transition:

  color .2s ease,
  transform .2s ease;

}


.see-all-btn:hover{

  color:#000;

  transform:
  translateX(2px);

}


.see-all-btn:active{

  transform:
  scale(.95);

}


/* =====================================================
   LIST
===================================================== */

.list-group{

  display:flex;

  flex-direction:column;

  gap:6px;

  margin-bottom:30px;

}


/* =====================================================
   LIST ITEM
===================================================== */

.list-item{

  display:flex;

  align-items:center;

  gap:14px;

  min-height:58px;

  text-decoration:none;

  color:inherit;

  cursor:pointer;

  background:transparent;

  border-radius:18px;

  padding:7px 8px;

  margin:0 -8px;

  opacity:0;

  transform:
  translateY(12px);

  animation:
  itemEnter .5s
  cubic-bezier(.22,1,.36,1)
  forwards;

  transition:

  background .2s ease,

  transform .18s
  cubic-bezier(.22,1,.36,1),

  opacity .18s ease;

}


/* ANIMATION */

@keyframes itemEnter{

  from{

    opacity:0;

    transform:
    translateY(12px);

  }

  to{

    opacity:1;

    transform:
    translateY(0);

  }

}


/* DESKTOP */

@media (hover:hover){

  .list-item:hover{

    background:#f4f4f4;

    transform:
    translateX(3px);

  }

}


/* MOBILE PRESS */

.list-item:active{

  background:#eeeeee;

  transform:
  scale(.975);

}


/* =====================================================
   COMMUNITY IMAGE
===================================================== */

.icon-wrapper{

  width:46px;

  height:46px;

  flex-shrink:0;

  border-radius:50%;

  overflow:hidden;

  background:#eee;

  transform:
  translateZ(0);

  transition:

  transform .3s
  cubic-bezier(.22,1,.36,1),

  box-shadow .3s ease;

}


.list-item:hover .icon-wrapper{

  transform:
  scale(1.06);

}


.list-item:active .icon-wrapper{

  transform:
  scale(.93);

}


/* IMAGE */

.community-image{

  width:100%;

  height:100%;

  display:block;

  object-fit:cover;

  transition:

  transform .5s
  cubic-bezier(.22,1,.36,1);

}


.list-item:hover
.community-image{

  transform:
  scale(1.08);

}


/* =====================================================
   FEED ICON
===================================================== */

.feed-icon{

  width:46px;

  height:46px;

  flex-shrink:0;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  transition:

  background .25s ease,
  transform .25s
  cubic-bezier(.22,1,.36,1);

}


.feed-icon svg{

  width:82%;

  height:82%;

  fill:none;

  stroke:#000;

  stroke-width:2;

  stroke-linecap:round;

  stroke-linejoin:round;

  transition:

  transform .25s
  cubic-bezier(.22,1,.36,1);

}


.list-item:hover
.feed-icon{

  background:#e9e9e9;

  transform:
  scale(1.05);

}


.list-item:hover
.feed-icon svg{

  transform:
  scale(1.05);

}


/* =====================================================
   TITLE
===================================================== */

.item-title{

  font-size:1.02rem;

  font-weight:800;

  color:#000;

  letter-spacing:-.35px;

  line-height:1.15;

  word-break:break-word;

  overflow-wrap:break-word;

}


/* =====================================================
   STAGGER
===================================================== */

#suggestedList
.list-item:nth-child(1){
  animation-delay:.12s;
}

#suggestedList
.list-item:nth-child(2){
  animation-delay:.18s;
}

#suggestedList
.list-item:nth-child(3){
  animation-delay:.24s;
}

#suggestedList
.list-item:nth-child(4){
  animation-delay:.30s;
}

#suggestedList
.list-item:nth-child(5){
  animation-delay:.36s;
}


/* OTHER FEEDS */

.list-group:not(#suggestedList)
.list-item:nth-child(1){
  animation-delay:.32s;
}

.list-group:not(#suggestedList)
.list-item:nth-child(2){
  animation-delay:.38s;
}

.list-group:not(#suggestedList)
.list-item:nth-child(3){
  animation-delay:.44s;
}

.list-group:not(#suggestedList)
.list-item:nth-child(4){
  animation-delay:.50s;
}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media
(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:.01ms !important;

    animation-iteration-count:1 !important;

    transition-duration:.01ms !important;

  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="page-header">

  <a
    href="index.html"
    target="_top"
    class="back-btn"
    aria-label="Go back"
  >

    <svg viewBox="0 0 24 24">

      <path d="M15 18l-6-6 6-6"/>

    </svg>

  </a>


  <h1 class="main-title">
    Communities
  </h1>

</div>



<!-- =========================
     SUGGESTED
========================= -->

<div class="section-header">

  <span class="section-label">
    Suggested
  </span>


  <a
    href="explore.html"
    target="_top"
    class="see-all-btn"
  >
    See all
  </a>

</div>



<!-- DYNAMIC SUGGESTED LIST -->

<div
  class="list-group"
  id="suggestedList"
>
</div>



<!-- =========================
     OTHER FEEDS
========================= -->

<div class="section-header">

  <span class="section-label">
    Other feeds
  </span>

</div>



<div class="list-group">


  <!-- UPDATES -->

  <a
    href="news.html"
    target="_top"
    class="list-item"
  >

    <div class="feed-icon">

      <svg viewBox="0 0 24 24">

        <path d="M4 5a2 2 0 0 1 2-2h14v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>

        <path d="M8 7h8"/>

        <path d="M8 11h8"/>

        <path d="M8 15h5"/>

        <path d="M17 15h1"/>

      </svg>

    </div>

    <span class="item-title">
      Updates
    </span>

  </a>



  <!-- SAVED -->

  <a
    href="saved.html"
    target="_top"
    class="list-item"
  >

    <div class="feed-icon">

      <svg viewBox="0 0 24 24">

        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>

      </svg>

    </div>

    <span class="item-title">
      Saved
    </span>

  </a>



  <!-- LIKED -->

  <a
    href="liked.html"
    target="_top"
    class="list-item"
  >

    <div class="feed-icon">

      <svg viewBox="0 0 24 24">

        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>

      </svg>

    </div>

    <span class="item-title">
      Liked
    </span>

  </a>



  <!-- GHOST POSTS -->

  <a
    href="ghost-posts.html"
    target="_top"
    class="list-item"
  >

    <div class="feed-icon">

      <svg viewBox="0 0 24 24">

        <path d="M9 10h.01M15 10h.01M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/>

      </svg>

    </div>

    <span class="item-title">
      Ghost posts
    </span>

  </a>


</div>



<!-- =========================
     COMMUNITIES DATA
========================= -->

<script src="communities-data.js"></script>



<!-- =========================
     RENDER SUGGESTED
========================= -->

<script>

const suggestedList =
document.getElementById("suggestedList");


const communities =
Array.isArray(window.communitiesData)
? window.communitiesData
: [];


/* GET FIRST 5 */

const suggested =
communities.slice(0,5);


/* RENDER */

suggested.forEach((community,index)=>{


  const item =
  document.createElement("a");


  item.className =
  "list-item";


  item.href =
  community.href ||
  "#";


  item.target =
  "_top";


  /* Dynamic stagger */

  item.style.animationDelay =
  `${0.12 + (index * 0.06)}s`;


  item.innerHTML = `

    <div class="icon-wrapper">

      <img
        src="${community.image}"
        alt="${community.title}"
        class="community-image"
        loading="lazy"
      >

    </div>


    <span class="item-title">

      ${community.title}

    </span>

  `;


  suggestedList
  .appendChild(item);


});

</script>


</body>

</html>
