<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:'Inter', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body{
  transition: transform .38s cubic-bezier(.2,.8,.2,1), opacity .38s ease;
  will-change: transform, opacity;
  position: relative;
}

/* 50% Left Embed Panel Drawer */
.left-drawer {
  position: fixed;
  top: 0;
  left: 0;
  width: 70vw;
  height: 100vh;
  z-index: 99;
  transform: translateX(-100%);
  transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
  background: #000;
  border-right: 1px solid rgba(255, 255, 255, 0.15);
}

.drawer-frame {
  width: 100%;
  height: 100%;
  border: none;
}

/* Main App Wrapper Sliding Right */
.app-wrapper {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 100;
  transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
  background: #000;
}

/* Active Drawer States */
body.drawer-open .left-drawer {
  transform: translateX(0);
}

body.drawer-open .app-wrapper {
  transform: translateX(70vw);
}

body.page-transition-down{
  transform: translateY(100vh);
  opacity:0;
}

body.page-transition-up{
  transform: translateY(-100vh);
  opacity:0;
}

#map{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  background: #000;
}

.brand-image-container {
  position: fixed;
  top: 0px;
  left: 0;
  width: 100%;
  z-index: 99999;
  --brand-height: 220px;
  pointer-events: auto;
}

.brand-link {
  display: block;
  width: 100%;
  height: var(--brand-height);
  text-decoration: none;
  cursor: pointer;
  pointer-events: auto;
}

.brand-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
  cursor: pointer;
  user-select: auto;
  pointer-events: auto;
  display: block;
  transition: opacity .2s ease;
}

.search-chip-wrapper {
  position: sticky;
  left: 0;
  flex-shrink: 0;
  z-index: 10;
  height: 36px;
  width: 36px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  overflow: hidden;
  transition: width 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.search-chip-wrapper.expanded {
  width: 160px;
  padding: 0 10px;
}

.search-toggle-btn {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border: none;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.search-toggle-btn svg {
  width: 18px;
  height: 18px;
  fill: #111;
}

.search-chip-input {
  width: 100%;
  height: 100%;
  border: none;
  background: transparent;
  outline: none;
  font-size: 0.85rem;
  font-weight: 600;
  color: #111;
  padding-left: 4px;
  display: none;
}

.search-chip-wrapper.expanded .search-chip-input {
  display: block;
}

.filter-container {
  position: fixed;
  bottom: 220px;
  left: 90px;
  width: 50%;
  border-radius: 20px;
  z-index: 99999;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.filter-container::-webkit-scrollbar { display: none; }

.filter-chip {
  flex-shrink: 0;
  padding: 8px 18px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: black;
  font-size: 0.85rem;
  font-weight: 700;
  border: 1px solid rgba(255, 255, 255, 0.4);
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(0,0,0,0.15);
  transition: background-color 0.2s ease, color 0.2s ease;
}

.filter-chip.active {
  background: #000000;
  color: #ffffff;
  border-color: white;
  box-shadow: 0 8px 20px rgba(0,123,255,0.4);
}

.map-style-btn,
.saved-posts-btn {
  position: fixed;
  right: 20px;
  z-index: 99999;
  width: 58px;
  height: 58px;
  border: none;
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 16px 40px rgba(0,0,0,0.28);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  transition: transform 0.2s ease, background 0.2s ease;
}

.saved-posts-btn { bottom: 315px; }
.map-style-btn { bottom: 245px; }

.saved-posts-btn:active, .map-style-btn:active { transform: scale(0.92); }
.saved-posts-btn.active { background: #000000; }

.saved-posts-btn svg {
  width: 24px;
  height: 24px;
  fill: #111;
  transition: fill 0.2s ease;
}

.saved-posts-btn.active svg { fill: #ffffff; }

.map-icon{
  width:28px;
  height:28px;
  position:relative;
}

.map-icon::before, .map-icon::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:10px;
  border:2.5px solid #111;
}

.map-icon::before{ transform:rotate(-8deg) translateY(-3px); opacity:.5; }
.map-icon::after{ background:white; }

.carousel{
  position:fixed;
  left:0;
  bottom:-5px;
  width:100%;
  height:240px;
  z-index:9999;
  overflow-x:auto;
  overflow-y:hidden;
  display:flex;
  gap:18px;
  padding:24px calc(50vw - 100px) 34px;
  scroll-snap-type:x mandatory;
  scroll-padding-inline:calc(50vw - 100px);
  -webkit-overflow-scrolling:touch;
  perspective:1200px;
  scrollbar-width:none;
}

.carousel::-webkit-scrollbar{ display:none; }

.card {
  position: relative;
  width: 200px;
  height: 200px;
  border-radius: 54px;
  overflow: hidden;
  flex-shrink: 0;
  scroll-snap-align: center;
  cursor: pointer;
  background: #111;
  box-shadow: 0 0 0 1.5px rgba(255,255,255,.10);
  transform-origin: center center;
  will-change: transform;
  transition: box-shadow .22s ease;
}

.card.active { box-shadow: 0 0 0 2px rgba(255,255,255,.9); }

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  pointer-events: none;
}

.card-overlay{

  inset:0;

.card-sub{ margin-top:120px; color:rgba(255,255,255,.72); font-size:.92rem; font-weight:500; pointer-events: none; }

.card-save-btn {

  -webkit-backdrop-filter: blur(4px);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  user-select: none;

}

.card-save-btn:active { transform: scale(0.88); }
.card-save-btn svg { width: 16px; height: 16px; fill: #ffffff; transition: fill 0.2s ease; }

.card-save-btn.is-saved svg { fill: #000000; }

  height:80px;

  border:3px solid rgba(255,255,255,.96);
  background:#111;

  transition:transform .26s ease;

.custom-marker img{ width:100%; height:100%; object-fit:cover; display:block; }
.custom-marker.active{ transform:scale(1.35); border:4px solid white; z-index:999999; }

.cluster-wrap{ width:120px; height:70px; position:relative; }
.cluster-card{
  position:absolute;
  width:80px;
  height:80px;

.folder-card-check {

<script>
/* =========================
INDEXEDDB CONTROLLER (PERSISTENT METADATA & FOLDERS)
========================= */
const DB_NAME = 'Sho1re1DB_v4';
const STORE_PLACES = 'saved_places';
const STORE_FOLDERS = 'custom_folders';
let db = null;

function initDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = (e) => {
      const dbInstance = e.target.result;
      if (!dbInstance.objectStoreNames.contains(STORE_PLACES)) {
        dbInstance.createObjectStore(STORE_PLACES, { keyPath: 'id' });
      }
      if (!dbInstance.objectStoreNames.contains(STORE_FOLDERS)) {
        dbInstance.createObjectStore(STORE_FOLDERS, { keyPath: 'name' });
      }
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      resolve(db);
    };
    request.onerror = (e) => reject(e.target.error);
  });
}

function savePlaceToDB(place, folderArray = ['Default']) {
  return new Promise((resolve, reject) => {
    if (!db) return reject('DB not initialized');
    const tx = db.transaction(STORE_PLACES, 'readwrite');
    const store = tx.objectStore(STORE_PLACES);
    place.folders = Array.from(new Set(folderArray));
    store.put(place);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e.target.error);
  });
}

function removePlaceFromDB(id) {
  return new Promise((resolve, reject) => {
    if (!db) return reject('DB not initialized');
    const tx = db.transaction(STORE_PLACES, 'readwrite');
    const store = tx.objectStore(STORE_PLACES);
    store.delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e.target.error);
  });
}

function getSavedPlacesFromDB() {
  return new Promise((resolve, reject) => {
    if (!db) return reject('DB not initialized');
    const tx = db.transaction(STORE_PLACES, 'readonly');
    const store = tx.objectStore(STORE_PLACES);
    const request = store.getAll();
    request.onsuccess = () => resolve(request.result || []);
    request.onerror = (e) => reject(e.target.error);
  });
}

function getFoldersFromDB() {
  return new Promise((resolve, reject) => {
    if (!db) return reject('DB not initialized');
    const tx = db.transaction(STORE_FOLDERS, 'readonly');
    const store = tx.objectStore(STORE_FOLDERS);
    const request = store.getAll();
    request.onsuccess = () => {
      const custom = request.result || [];
      const hasDefault = custom.some(f => f.name === 'Default');
      if (!hasDefault) {
        custom.unshift({ name: 'Default', cover: '' });
      }
      resolve(custom);
    };
    request.onerror = (e) => reject(e.target.error);
  });
}

function saveFolderToDB(folderObj, oldName = null) {
  return new Promise((resolve, reject) => {
    if (!db) return reject('DB not initialized');
    const tx = db.transaction([STORE_FOLDERS, STORE_PLACES], 'readwrite');
    const folderStore = tx.objectStore(STORE_FOLDERS);
    const placeStore = tx.objectStore(STORE_PLACES);

    if (oldName && oldName !== folderObj.name) {
      folderStore.delete(oldName);
      const placeReq = placeStore.getAll();
      placeReq.onsuccess = () => {
        placeReq.result.forEach(p => {
          if (p.folders && p.folders.includes(oldName)) {
            p.folders = p.folders.map(f => f === oldName ? folderObj.name : f);
            placeStore.put(p);
          }
        });
      };
    }

    folderStore.put(folderObj);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e.target.error);
  });
}

/* =========================
SWIPE ROUTES & LEFT-TO-RIGHT 50% DRAWER TOUCH HANDLERS
========================= */
const SWIPE_ROUTES = { top: 'feed.html', bottom: 'explore.html' };

function triggerPageTransition(direction, href){
  const body = document.body;
  if(body.classList.contains('page-transition-down') || body.classList.contains('page-transition-up')) return;
  body.classList.add(direction === 'down' ? 'page-transition-down' : 'page-transition-up');
  setTimeout(() => { window.location.href = href; }, 360);
}

function bindEdgeSwipe(zoneEl, direction, href, threshold = 70){
  let startX = 0, startY = 0, active = false;

  zoneEl.addEventListener('pointerdown', (e) => {
    active = true;
    startX = e.clientX;
    startY = e.clientY;
  }, { passive: true });

  zoneEl.addEventListener('pointerup', (e) => {
    if(!active) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    active = false;

    if(direction === 'down' && dy > threshold && Math.abs(dy) > Math.abs(dx)){
      triggerPageTransition('down', href);
    } else if(direction === 'up' && dy < -threshold && Math.abs(dy) > Math.abs(dx)){
      triggerPageTransition('up', href);
    }
  });

  zoneEl.addEventListener('pointercancel', () => { active = false; });
}

bindEdgeSwipe(document.getElementById('swipeTop'), 'down', SWIPE_ROUTES.top, 60);
bindEdgeSwipe(document.getElementById('swipeBottom'), 'up', SWIPE_ROUTES.bottom, 60);

/* Horizontal Left-to-Right Swipe Trigger */
let hStartX = 0, hStartY = 0, hActive = false;

document.addEventListener('pointerdown', (e) => {
  hStartX = e.clientX;
  hStartY = e.clientY;
  hActive = true;
}, { passive: true });

document.addEventListener('pointerup', (e) => {
  if(!hActive) return;
  const dx = e.clientX - hStartX;
  const dy = e.clientY - hStartY;
  hActive = false;

  // Swipe Left-to-Right from near left edge (< 80px) to slide open drawer
  if (dx > 70 && Math.abs(dx) > Math.abs(dy) && hStartX < 80) {
    document.body.classList.add('drawer-open');
  } 
  // Swipe Right-to-Left anywhere to close drawer
  else if (dx < -70 && Math.abs(dx) > Math.abs(dy) && document.body.classList.contains('drawer-open')) {
    document.body.classList.remove('drawer-open');
  }
});

document.addEventListener('pointercancel', () => { hActive = false; });
/* =========================
MAP INITIALIZATION & UI EVENTS
========================= */
const map = L.map('map', { zoomControl: false, attributionControl: false, preferCanvas: true }).setView([15.9041, 73.8219], 15);
const normalMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20 });
const satelliteMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });
const darkMap = L.tileLayer('https://{s.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 });

satelliteMap.addTo(map);
const modes = [satelliteMap, normalMap, darkMap];
let currentMode = 0;

toggleBtn.onclick = () => {
  map.removeLayer(modes[currentMode]);
  currentMode = (currentMode + 1) % modes.length;
  modes[currentMode].addTo(map);
};

/* =========================
RENDER MAP & CAROUSEL FUNCTION
========================= */
function renderMapAndCarousel() {
  carousel.innerHTML = '';
  clusterLayer.clearLayers();
  cardRefs = [];
  markerMap.clear();
  activeIndex = -1;

  if (activePlaces.length === 0) return;

  activePlaces.forEach((place, idx) => {
    // 1. Create Carousel Card
    const card = document.createElement('div');
    card.className = 'card';
    const isSaved = savedPlacesMap.has(place.id);

    card.innerHTML = `
      <button class="card-save-btn ${isSaved ? 'is-saved' : ''}">
        <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
      </button>
      <img src="${place.image}" loading="lazy" alt="${place.title || ''}" />
      <div class="card-overlay">
        <div class="card-type">${place.type || ''}</div>
        <div class="card-sub">${place.subtype || ''}</div>
      </div>
    `;

    const saveBtn = card.querySelector('.card-save-btn');
    setupCardSave(saveBtn, place);

    card.onclick = (e) => {
      if (e.target.closest('.card-save-btn')) return;
      setActive(idx);
      map.flyTo([place.lat, place.lng], 16, { animate: true, duration: 0.8 });
    };

    carousel.appendChild(card);
    cardRefs.push(card);

    // 2. Create Leaflet Marker
    const customIcon = L.divIcon({
      html: `<div class="custom-marker"><img src="${place.image}" loading="lazy" alt="" /></div>`,
      className: '',
      iconSize: [80, 80],
      iconAnchor: [40, 40]
    });

    const marker = L.marker([place.lat, place.lng], { icon: customIcon, place: place });
    marker.on('click', () => {
      setActive(idx);
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    });

    clusterLayer.addLayer(marker);
    markerMap.set(idx, marker);
  });

  // Activate first place
  setActive(0);
}

/* =========================
FLOATING SAVE BUTTON (CLICK & LONG-CLICK)
========================= */
let savedBtnTimer = null;
let savedBtnLongPress = false;

savedFilterBtn.addEventListener('pointerdown', () => {
  savedBtnLongPress = false;
  savedBtnTimer = setTimeout(() => {
    savedBtnLongPress = true;
    openFolderPage(true);
  }, 450);
});

savedFilterBtn.addEventListener('pointerup', () => clearTimeout(savedBtnTimer));
savedFilterBtn.addEventListener('pointercancel', () => clearTimeout(savedBtnTimer));

savedFilterBtn.onclick = () => {
  if (savedBtnLongPress) return;
  
  if (showOnlySaved && selectedViewFolder === 'Default') {
    showOnlySaved = false;
    selectedViewFolder = 'ALL';
    savedFilterBtn.classList.remove('active');
  } else {
    showOnlySaved = true;
    selectedViewFolder = 'Default';
    savedFilterBtn.classList.add('active');
  }
  applyFilters();
};

/* =========================
CARD SAVE INTERACTIONS
========================= */
function setupCardSave(btn, place) {
  let timer = null;
  let isLongPress = false;

  btn.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    isLongPress = false;
    timer = setTimeout(() => {
      isLongPress = true;
      openFolderPage(false, place);
    }, 450);
  });

  btn.addEventListener('pointerup', (e) => { e.stopPropagation(); clearTimeout(timer); });
  btn.addEventListener('pointercancel', (e) => { e.stopPropagation(); clearTimeout(timer); });

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (isLongPress) return;
    
    const existing = savedPlacesMap.get(place.id);
    if (existing) {
      removePlaceFromDB(place.id).then(() => {
        savedPlacesMap.delete(place.id);
        btn.classList.remove('is-saved');
        if (showOnlySaved) applyFilters();
      });
    } else {
      savePlaceToDB(place, ['Default']).then(() => {
        savedPlacesMap.set(place.id, { place, folders: ['Default'] });
        btn.classList.add('is-saved');
      });
    }
  });
}

/* =========================
FULL-PAGE FOLDER OVERLAY LOGIC
========================= */
function openFolderPage(viewMode, place = null) {
  isFolderViewMode = viewMode;
  targetSavePlace = place;
  folderPageHeaderTitle.textContent = viewMode ? "Select Folder to View" : "Save to Folders";
  renderFolderGrid();
  folderPageOverlay.classList.add('active');
}

function closeFolderPage() {
  folderPageOverlay.classList.remove('active');
  targetSavePlace = null;
}

folderPageCloseBtn.onclick = closeFolderPage;

function renderFolderGrid() {
  getFoldersFromDB().then(folders => {
    folderGrid.innerHTML = '';
    
    if (isFolderViewMode) {
      const allSavedCount = savedPlacesMap.size;
      const isSelected = selectedViewFolder === 'ALL';
      const allCard = createFolderCardHTML({ name: "All Saved", cover: "" }, allSavedCount, isSelected, true);
      allCard.onclick = () => {
        selectedViewFolder = 'ALL';
        showOnlySaved = true;
        savedFilterBtn.classList.add('active');
        applyFilters();
        closeFolderPage();
      };
      folderGrid.appendChild(allCard);
    }

    folders.forEach(folderObj => {
      let count = 0;
      let isSelected = false;

      savedPlacesMap.forEach(item => {
        if (item.folders && item.folders.includes(folderObj.name)) count++;
      });

      if (isFolderViewMode) {
        isSelected = selectedViewFolder === folderObj.name;
      } else if (targetSavePlace && savedPlacesMap.has(targetSavePlace.id)) {
        const item = savedPlacesMap.get(targetSavePlace.id);
        isSelected = item.folders.includes(folderObj.name);
      }

      const card = createFolderCardHTML(folderObj, count, isSelected, false);

      card.onclick = (e) => {
        if (e.target.closest('.folder-edit-btn')) return;

        if (isFolderViewMode) {
          selectedViewFolder = folderObj.name;
          showOnlySaved = true;
          savedFilterBtn.classList.add('active');
          applyFilters();
          closeFolderPage();
        } else if (targetSavePlace) {
          let currentFolders = savedPlacesMap.has(targetSavePlace.id) ? 
            [...savedPlacesMap.get(targetSavePlace.id).folders] : [];

          if (currentFolders.includes(folderObj.name)) {
            currentFolders = currentFolders.filter(f => f !== folderObj.name);
          } else {
            currentFolders.push(folderObj.name);
          }

          if (currentFolders.length === 0) {
            removePlaceFromDB(targetSavePlace.id).then(() => {
              savedPlacesMap.delete(targetSavePlace.id);
              renderFolderGrid();
              applyFilters();
            });
          } else {
            savePlaceToDB(targetSavePlace, currentFolders).then(() => {
              savedPlacesMap.set(targetSavePlace.id, { place: targetSavePlace, folders: currentFolders });
              renderFolderGrid();
              applyFilters();
            });
          }
        }
      };

      folderGrid.appendChild(card);
    });
  });
}

function createFolderCardHTML(folderObj, count, isSelected, isSpecialAll = false) {
  const card = document.createElement('div');
  card.className = `folder-card ${isSelected ? 'selected' : ''}`;
  
  const coverUrl = folderObj.cover || '';
  const bgImgHTML = coverUrl ? `<img src="${coverUrl}" class="folder-card-bg" alt="" />` : '';

  card.innerHTML = `
    ${bgImgHTML}
    <div class="folder-card-content">
      <div class="folder-card-top">
        <div class="folder-card-icon">
          <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        </div>
        ${!isSpecialAll && folderObj.name !== 'Default' ? `
          <button class="folder-edit-btn" title="Edit Folder">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          </button>
        ` : `<div class="folder-card-check"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>`}
      </div>
      <div class="folder-card-info">
        <div class="folder-card-name">${folderObj.name}</div>
        <div class="folder-card-count">${count} ${count === 1 ? 'item' : 'items'}</div>
      </div>
    </div>
  `;

  const editBtn = card.querySelector('.folder-edit-btn');
  if (editBtn) {
    editBtn.onclick = (e) => {
      e.stopPropagation();
      openEditFolderModal(folderObj);
    };
  }

  return card;
}

/* EDIT & CREATE FOLDER MODAL LOGIC */
fabNewFolderBtn.onclick = () => {
  editingFolderOldName = null;
  modalDialogTitle.textContent = "Create Custom Folder";
  createFolderNameInput.value = '';
  createFolderCoverInput.value = '';
  currentBase64Cover = '';
  coverPreviewBox.innerHTML = '<span>Cover Preview</span>';
  createFolderDialog.classList.add('active');
};

function openEditFolderModal(folderObj) {
  editingFolderOldName = folderObj.name;
  modalDialogTitle.textContent = "Edit Folder";
  createFolderNameInput.value = folderObj.name;
  createFolderCoverInput.value = folderObj.cover || '';
  currentBase64Cover = folderObj.cover || '';

  if (currentBase64Cover) {
    coverPreviewBox.innerHTML = `<img src="${currentBase64Cover}" alt="" />`;
  } else {
    coverPreviewBox.innerHTML = '<span>Cover Preview</span>';
  }
  createFolderDialog.classList.add('active');
}

coverFileInput.onchange = (e) => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (evt) => {
      currentBase64Cover = evt.target.result;
      coverPreviewBox.innerHTML = `<img src="${currentBase64Cover}" alt="" />`;
    };
    reader.readAsDataURL(file);
  }
};

createFolderCoverInput.oninput = (e) => {
  const url = e.target.value.trim();
  if (url) {
    currentBase64Cover = url;
    coverPreviewBox.innerHTML = `<img src="${url}" alt="" />`;
  }
};

cancelFolderCreation.onclick = () => createFolderDialog.classList.remove('active');

confirmFolderCreation.onclick = () => {
  const name = createFolderNameInput.value.trim();
  if (!name) return;

  const folderObj = {
    name: name,
    cover: currentBase64Cover || createFolderCoverInput.value.trim()
  };

  saveFolderToDB(folderObj, editingFolderOldName).then(() => {
    createFolderDialog.classList.remove('active');
    getSavedPlacesFromDB().then(savedItems => {
      savedPlacesMap = new Map(savedItems.map(item => [item.id, { place: item, folders: item.folders || ['Default'] }]));
      renderFolderGrid();
      applyFilters();
    });
  });
};

/* =========================
MARKER CLUSTER & FILTERS
========================= */
const clusterLayer = L.markerClusterGroup({
  showCoverageOnHover: false,
  spiderfyOnMaxZoom: true,
  disableClusteringAtZoom: 17,
  maxClusterRadius: 90,
  iconCreateFunction: (cluster) => {
    const total = cluster.getChildCount();
    const images = cluster.getAllChildMarkers().slice(0, 3).map(m => `
      <div class="cluster-card"><img src="${m.options.place.image}" loading="lazy" alt=""></div>
    `).join('');
    return L.divIcon({
      html: `<div class="cluster-wrap"><div class="cluster-count">${total > 9 ? '10+' : total}</div>${images}</div>`,
      className: '',
      iconSize: [120, 70]
    });
  }
});
map.addLayer(clusterLayer);

function setActive(index){
  if(activeIndex === index) return;
  if(cardRefs[activeIndex]) cardRefs[activeIndex].classList.remove('active');
  const oldMarker = markerMap.get(activeIndex);
  if(oldMarker && oldMarker.getElement()) {
    const el = oldMarker.getElement().querySelector('.custom-marker');
    if(el) el.classList.remove('active');
  }

  activeIndex = index;

  if(cardRefs[index]) cardRefs[index].classList.add('active');
  const newMarker = markerMap.get(index);
  if(newMarker && newMarker.getElement()) {
    const el = newMarker.getElement().querySelector('.custom-marker');
    if(el) el.classList.add('active');
  }
}

function buildFilterChips() {
  const types = ['All', ...new Set(rawPlaces.map(p => p.type).filter(Boolean))];
  filterContainer.innerHTML = '';
  filterContainer.appendChild(searchChipWrapper);
  
  types.forEach(type => {
    const chip = document.createElement('div');
    chip.className = `filter-chip ${type === selectedFilter ? 'active' : ''}`;
    chip.textContent = type;
    chip.onclick = () => {
      selectedFilter = type;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      applyFilters();
    };
    filterContainer.appendChild(chip);
  });
}

searchBtn.onclick = () => {
  searchChipWrapper.classList.toggle('expanded');
  if (searchChipWrapper.classList.contains('expanded')) {
    searchInput.focus();
  } else {
    searchQuery = '';
    searchInput.value = '';
    applyFilters();
  }
};

searchInput.oninput = (e) => {
  searchQuery = e.target.value.toLowerCase().trim();
  applyFilters();
};

function applyFilters() {
  activePlaces = rawPlaces.filter(place => {
    const savedData = savedPlacesMap.get(place.id);

    if (showOnlySaved) {
      if (!savedData) return false;
      if (selectedViewFolder !== 'ALL' && !savedData.folders.includes(selectedViewFolder)) return false;
    }

    const matchesFilter = selectedFilter === 'All' || place.type === selectedFilter;
    const matchesSearch = !searchQuery || 
      (place.type && place.type.toLowerCase().includes(searchQuery)) ||
      (place.subtype && place.subtype.toLowerCase().includes(searchQuery)) ||
      (place.title && place.title.toLowerCase().includes(searchQuery));
    return matchesFilter && matchesSearch;
  });
  renderMapAndCarousel();
}

// Startup execution
initDB().then(() => {
  getSavedPlacesFromDB().then(savedItems => {
    savedPlacesMap = new Map(savedItems.map(item => [item.id, { place: item, folders: item.folders || ['Default'] }]));
    buildFilterChips();
    applyFilters();
  });
});
