name: Delete Post

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Delete post with ID 2
        run: |
          node <<'EOF'
          const fs = require("fs");

          const file = "app.js";

          let content = fs.readFileSync(file, "utf8");

          // Match the complete object containing id: 2
          const regex = /,\s*\{\s*id:\s*2,[\s\S]*?\n\s*\}/;

          if (!regex.test(content)) {
            console.log("Post with ID 2 was not found.");
            process.exit(0);
          }

          content = content.replace(regex, "");

          fs.writeFileSync(file, content, "utf8");

          console.log("Post with ID 2 deleted successfully.");
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app.js

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Delete post ID 2"
            git push
          fi
