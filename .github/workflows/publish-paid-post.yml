name: Publish verified Sho1re1 post

on:
  repository_dispatch:
    types: [sho1re1_paid_post]

permissions:
  contents: write

concurrency:
  group: sho1re1-post-database
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate payment and append post
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const payload = JSON.parse(process.env.PAYLOAD || '{}');
          const post = payload.post || {};
          const payment = payload.payment || {};
          if (payment.status !== 'success' || Number(payment.amount) !== 10 || !payment.orderId || !payment.utr) {
            throw new Error('Payment is not verified or does not match the ₹10 post fee.');
          }
          for (const key of ['title', 'topic', 'type', 'subtype']) {
            if (typeof post[key] !== 'string' || !post[key].trim()) throw new Error('Missing post field: ' + key);
          }
          const lat = Number(post.lat), lng = Number(post.lng);
          if (!Number.isFinite(lat) || lat < -90 || lat > 90 || !Number.isFinite(lng) || lng < -180 || lng > 180) throw new Error('Invalid coordinates.');
          const file = 'app.js';
          let source = fs.readFileSync(file, 'utf8');
          const marker = 'window.Sho1re1Places =';
          const markerStart = source.indexOf(marker);
          if (markerStart < 0) throw new Error('Sho1re1Places database not found.');
          const arrayStart = source.indexOf('[', markerStart);
          let depth = 0, quote = null, escaped = false, arrayEnd = -1;
          for (let i = arrayStart; i < source.length; i++) {
            const ch = source[i];
            if (quote !== null) {
              if (escaped) { escaped = false; continue; }
              if (ch === '\\') { escaped = true; continue; }
              if (ch === quote) quote = null;
              continue;
            }
            if (ch === '"' || ch === "'" || ch === '`') { quote = ch; continue; }
            if (ch === '[') depth++;
            if (ch === ']' && --depth === 0) { arrayEnd = i + 1; break; }
          }
          if (arrayEnd < 0) throw new Error('Could not locate database end.');
          const places = vm.runInNewContext('(' + source.slice(arrayStart, arrayEnd) + ')');
          if (!Array.isArray(places)) throw new Error('Post database is invalid.');
          if (places.some(p => p.paymentOrderId === payment.orderId)) {
            console.log('This payment order was already published.');
            process.exit(0);
          }
          const numericIds = places.map(p => Number(p.id)).filter(Number.isFinite);
          const record = {
            id: Math.max(0, ...numericIds) + 1,
            title: String(post.title).trim().slice(0, 100),
            topic: String(post.topic).trim().slice(0, 60),
            type: String(post.type).trim().slice(0, 60),
            subtype: String(post.subtype).trim().slice(0, 60),
            plan: ['FREE', 'PRO', 'PREMIUM'].includes(String(post.plan).toUpperCase()) ? String(post.plan).toUpperCase() : 'FREE',
            lat, lng,
            image: typeof post.image === 'string' ? post.image : '',
            link: typeof post.link === 'string' ? post.link : '',
            plan2: ['7D', '14D', '30D'].includes(String(post.plan2).toUpperCase()) ? String(post.plan2).toUpperCase() : '7D',
            createdOn: new Date().toISOString(),
            paymentOrderId: String(payment.orderId),
            paymentUtr: String(payment.utr),
            paymentAmount: 10,
            postCode: String(payment.postCode || '')
          };
          places.push(record);
          const rebuilt = 'window.Sho1re1Places = ' + JSON.stringify(places, null, 2) + ';';
          fs.writeFileSync(file, source.slice(0, markerStart) + rebuilt + source.slice(arrayEnd));
          console.log('Published paid post:', record.id, record.title, record.paymentOrderId);
          NODE

      - name: Commit post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified paid Sho1re1 post"
            git push
          else
            echo "No new post to publish."
          fi
