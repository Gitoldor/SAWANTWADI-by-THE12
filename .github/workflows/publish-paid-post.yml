name: Publish Sho1re1 browser-submitted post

on:
  workflow_dispatch:
    inputs:
      post_json:
        description: "Post data JSON"
        required: true
        type: string
      order_id:
        description: "FamGateway order ID"
        required: true
        type: string
      utr:
        description: "FamGateway verified UTR"
        required: true
        type: string
      amount:
        description: "Verified amount in INR"
        required: true
        type: string
      post_code:
        description: "Generated Sho1re1 post code"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: sho1re1-d1-post-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified post to Cloudflare D1
        env:
          POST_JSON: ${{ inputs.post_json }}
          ORDER_ID: ${{ inputs.order_id }}
          UTR: ${{ inputs.utr }}
          AMOUNT: ${{ inputs.amount }}
          POST_CODE: ${{ inputs.post_code }}
          OIDC_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          OIDC_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          node <<'NODE'
          (async () => {
            const post = JSON.parse(process.env.POST_JSON || '{}');
            const amount = Number(process.env.AMOUNT);
            if (!process.env.ORDER_ID || !process.env.UTR || amount !== 1) {
              throw new Error('Missing payment reference or amount is not ₹1.');
            }
            const oidcUrl = new URL(process.env.OIDC_URL);
            oidcUrl.searchParams.set('audience', 'sho1re1-d1-api');
            const oidcResponse = await fetch(oidcUrl, {
              headers: { Authorization: 'Bearer ' + process.env.OIDC_TOKEN }
            });
            if (!oidcResponse.ok) throw new Error('GitHub OIDC authentication failed.');
            const oidc = await oidcResponse.json();
            if (!oidc.value) throw new Error('GitHub OIDC token was not returned.');

            const response = await fetch('https://sawantwadi-data-api.sho1re1.workers.dev/places', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + oidc.value
              },
              body: JSON.stringify({
                post,
                orderId: process.env.ORDER_ID,
                utr: process.env.UTR,
                amount,
                postCode: process.env.POST_CODE || ''
              })
            });
            const result = await response.json();
            if (!response.ok || !result.success) {
              throw new Error(result.error || 'D1 post publish failed.');
            }
            console.log(result.duplicate ? 'Payment order already published:' : 'Published D1 post:', result.id);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
