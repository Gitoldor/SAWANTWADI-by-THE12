name: Expire Posts

on:

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write


jobs:

  expire-posts:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Remove expired posts
        env:
          TZ: Asia/Kolkata
        run: |

          node <<'NODE'

          const fs = require("fs");
          const vm = require("vm");

          const file = "app.js";

          let source =
            fs.readFileSync(
              file,
              "utf8"
            );


          const marker =
            "window.Sho1re1Places =";


          const start =
            source.indexOf(
              marker
            );


          const arrayStart =
            source.indexOf(
              "[",
              start
            );


          const endMarker =
            "window.Sho1re1OriginalPlaces";


          const arrayEnd =
            source.indexOf(
              endMarker,
              arrayStart
            );


          if (
            start === -1 ||
            arrayStart === -1 ||
            arrayEnd === -1
          ) {

            throw new Error(
              "Could not locate Sho1re1Places."
            );

          }


          const arraySource =
            source.slice(
              arrayStart,
              arrayEnd
            )
            .replace(
              /;\s*$/,
              ""
            )
            .trim();


          const sandbox = {};

          const places =
            vm.runInNewContext(
              "(" +
              arraySource +
              ")",
              sandbox
            );


          if (
            !Array.isArray(
              places
            )
          ) {

            throw new Error(
              "Sho1re1Places is not an array."
            );

          }


          const now =
            Date.now();


          const durations = {

            "7D":
              7 * 24 * 60 * 60 * 1000,

            "14D":
              14 * 24 * 60 * 60 * 1000,

            "30D":
              30 * 24 * 60 * 60 * 1000

          };


          const remaining = [];

          const removed = [];


          for (
            const post of places
          ) {

            const created =
              Date.parse(
                post.createdOn
              );


            const lifetime =
              durations[
                String(
                  post.plan2 || ""
                ).toUpperCase()
              ];


            if (
              !Number.isFinite(
                created
              ) ||
              !lifetime
            ) {

              remaining.push(
                post
              );

              continue;

            }


            const expiresAt =
              created +
              lifetime;


            if (
              now >= expiresAt
            ) {

              removed.push(
                post.id
              );

            } else {

              remaining.push(
                post
              );

            }

          }


          if (
            removed.length === 0
          ) {

            console.log(
              "No expired posts."
            );

            process.exit(0);

          }


          const newDatabase =
            "window.Sho1re1Places = " +
            JSON.stringify(
              remaining,
              null,
              2
            ) +
            ";\n\n\n";


          const newSource =
            source.slice(
              0,
              arrayStart
            ) +
            newDatabase +
            source.slice(
              arrayEnd
            );


          fs.writeFileSync(
            file,
            newSource
          );


          console.log(
            "Removed expired posts:",
            removed.join(", ")
          );


          console.log(
            "Remaining posts:",
            remaining.length
          );

          NODE


      - name: Commit expired-post cleanup
        run: |

          if git diff --quiet; then

            echo "No changes."

            exit 0

          fi


          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add app.js


          git commit \
            -m "Expire old posts"


          git push
