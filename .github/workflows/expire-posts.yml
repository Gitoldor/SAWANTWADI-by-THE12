name: Expire Posts

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  expire-posts:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Remove expired posts
        run: |

          node <<'NODE'

          const fs = require("fs");
          const vm = require("vm");

          const file = "app.js";

          let source =
            fs.readFileSync(
              file,
              "utf8"
            );


          /* -----------------------------------------------
             FIND DATABASE
          ------------------------------------------------ */

          const marker =
            "window.Sho1re1Places =";

          const markerStart =
            source.indexOf(
              marker
            );

          if (
            markerStart === -1
          ) {

            throw new Error(
              "window.Sho1re1Places not found."
            );

          }


          const arrayStart =
            source.indexOf(
              "[",
              markerStart
            );

          if (
            arrayStart === -1
          ) {

            throw new Error(
              "Opening [ not found."
            );

          }


          /* -----------------------------------------------
             FIND MATCHING ]
          ------------------------------------------------ */

          let depth = 0;
          let quote = null;
          let escaped = false;
          let arrayEnd = -1;


          for (
            let i = arrayStart;
            i < source.length;
            i++
          ) {

            const char =
              source[i];


            if (
              quote !== null
            ) {

              if (
                escaped
              ) {

                escaped = false;

                continue;

              }


              if (
                char === "\\"
              ) {

                escaped = true;

                continue;

              }


              if (
                char === quote
              ) {

                quote = null;

              }

              continue;

            }


            if (
              char === '"' ||
              char === "'" ||
              char === "`"
            ) {

              quote = char;

              continue;

            }


            if (
              char === "["
            ) {

              depth++;

            }


            if (
              char === "]"
            ) {

              depth--;

              if (
                depth === 0
              ) {

                arrayEnd =
                  i + 1;

                break;

              }

            }

          }


          if (
            arrayEnd === -1
          ) {

            throw new Error(
              "Closing ] not found."
            );

          }


          /* -----------------------------------------------
             READ POSTS
          ------------------------------------------------ */

          const arraySource =
            source.slice(
              arrayStart,
              arrayEnd
            );


          let places;


          try {

            places =
              vm.runInNewContext(
                "(" +
                arraySource +
                ")"
              );

          } catch (
            error
          ) {

            throw new Error(
              "Could not parse Sho1re1Places:\n" +
              error.message
            );

          }


          if (
            !Array.isArray(
              places
            )
          ) {

            throw new Error(
              "Sho1re1Places is not an array."
            );

          }


          /* -----------------------------------------------
             LIFETIMES
          ------------------------------------------------ */

          const durations = {

            "7D":
              7 *
              24 *
              60 *
              60 *
              1000,

            "14D":
              14 *
              24 *
              60 *
              60 *
              1000,

            "30D":
              30 *
              24 *
              60 *
              60 *
              1000

          };


          const now =
            Date.now();


          const remaining = [];

          const removed = [];


          /* -----------------------------------------------
             CHECK EVERY POST
          ------------------------------------------------ */

          for (
            const post of places
          ) {

            const created =
              Date.parse(
                post.createdOn
              );


            const lifetime =
              durations[
                String(
                  post.plan2 || ""
                ).toUpperCase()
              ];


            /*
              Missing or invalid expiry data:
              KEEP THE POST.
            */

            if (
              !Number.isFinite(
                created
              ) ||
              !lifetime
            ) {

              remaining.push(
                post
              );

              continue;

            }


            const expiresAt =
              created +
              lifetime;


            if (
              now >=
              expiresAt
            ) {

              removed.push(
                post.id
              );

            } else {

              remaining.push(
                post
              );

            }

          }


          /* -----------------------------------------------
             NOTHING TO DELETE
          ------------------------------------------------ */

          if (
            removed.length === 0
          ) {

            console.log(
              "No expired posts."
            );

            process.exit(0);

          }


          /* -----------------------------------------------
             REBUILD DATABASE
          ------------------------------------------------ */

          const newDatabase =
            "window.Sho1re1Places = " +
            JSON.stringify(
              remaining,
              null,
              2
            ) +
            ";";


          const newSource =
            source.slice(
              0,
              markerStart
            ) +

            newDatabase +

            source.slice(
              arrayEnd
            );


          fs.writeFileSync(
            file,
            newSource
          );


          console.log(
            "Expired posts removed:",
            removed.join(", ")
          );


          console.log(
            "Remaining posts:",
            remaining.length
          );

          NODE


      - name: Commit changes
        run: |

          if git diff --quiet; then

            echo "No changes."

            exit 0

          fi


          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add app.js


          git commit \
            -m "Expire old posts"


          git push
