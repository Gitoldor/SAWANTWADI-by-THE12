name: Expire Sho1re1 D1 Posts

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  expire-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Expire posts in Cloudflare D1
        run: |
          node <<'NODE'
          (async () => {
            const oidcUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            oidcUrl.searchParams.set('audience', 'sho1re1-d1-api');
            const auth = await fetch(oidcUrl, {
              headers: { Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }
            });
            if (!auth.ok) throw new Error('GitHub OIDC authentication failed.');
            const token = (await auth.json()).value;
            if (!token) throw new Error('GitHub OIDC token was not returned.');

            const response = await fetch('https://sawantwadi-data-api.sho1re1.workers.dev/expire', {
              method: 'POST',
              headers: { Authorization: 'Bearer ' + token }
            });
            const result = await response.json();
            if (!response.ok || !result.success) throw new Error(result.error || 'D1 expiry failed.');
            console.log('Expired post IDs:', (result.deleted || []).join(', ') || 'none');
            console.log('Remaining posts:', result.remaining);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
