# ============================================================
# SAWANTWADI NOTIFICATION AUTO EXPIRER
# ============================================================
#
# PURPOSE:
# Automatically removes notifications from notificationdata.js
# after they have completed a full 24 hours.
#
# SCHEDULE:
# Every 12 hours.
#
# IMPORTANT:
# A notification is NOT deleted simply because its calendar date
# changed.
#
# Example:
#
# createdAt = 2026-09-15T18:30:00Z
#
# It becomes eligible for deletion only after:
#
# 2026-09-16T18:30:00Z
#
# This guarantees a COMPLETE 24 HOURS.
#
# ============================================================

name: Expire Notifications


# ============================================================
# WHEN THE ACTION RUNS
# ============================================================

on:

  # Automatically every 12 hours
  schedule:

    - cron: "0 */12 * * *"


  # Allows you to manually run it from:
  # GitHub → Actions → Expire Notifications → Run workflow
  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================

permissions:

  contents: write


# ============================================================
# JOB
# ============================================================

jobs:

  expire:

    runs-on: ubuntu-latest


    steps:


      # ======================================================
      # DOWNLOAD REPOSITORY
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ======================================================
      # REMOVE EXPIRED NOTIFICATIONS
      # ======================================================

      - name: Remove notifications older than 24 hours

        env:

          DATA_FILE: notificationdata.js

        run: |

          python3 <<'PY'

          import re
          import json
          from datetime import datetime, timezone, timedelta


          # ==================================================
          # CONFIGURATION
          # ==================================================

          FILE = "notificationdata.js"

          # Complete lifetime of one notification
          LIFETIME = timedelta(hours=24)


          # ==================================================
          # CURRENT UTC TIME
          # ==================================================

          now = datetime.now(timezone.utc)


          print("")
          print("==============================================")
          print(" NOTIFICATION EXPIRATION")
          print("==============================================")
          print("Current UTC time:")
          print(now.isoformat())
          print("")


          # ==================================================
          # READ FILE
          # ==================================================

          with open(
              FILE,
              "r",
              encoding="utf-8"
          ) as f:

              text = f.read()


          # ==================================================
          # FIND NOTIFICATION OBJECTS
          # ==================================================
          #
          # Expected structure:
          #
          # {
          #   id:"n1",
          #   image:"...",
          #   title:"...",
          #   message:"...",
          #   link:"...",
          #   createdAt:"..."
          # }
          #
          # ==================================================

          object_pattern = re.compile(
              r'\{\s*'
              r'id\s*:\s*["\']([^"\']+)["\']\s*,\s*'
              r'image\s*:\s*["\'](.*?)["\']\s*,\s*'
              r'title\s*:\s*["\'](.*?)["\']\s*,\s*'
              r'message\s*:\s*["\'](.*?)["\']\s*,\s*'
              r'link\s*:\s*["\'](.*?)["\']\s*,\s*'
              r'createdAt\s*:\s*["\']([^"\']+)["\']\s*'
              r'\}',
              re.DOTALL
          )


          matches = list(
              object_pattern.finditer(text)
          )


          if not matches:

              print(
                  "No notification objects found."
              )

              raise SystemExit(0)


          # ==================================================
          # CHECK EACH NOTIFICATION
          # ==================================================

          keep = []
          removed = []


          for match in matches:

              notification_id = match.group(1)

              created_at_text = match.group(6)


              try:

                  created_at =
                      datetime.fromisoformat(
                          created_at_text.replace(
                              "Z",
                              "+00:00"
                          )
                      )


                  # Make sure comparison is UTC
                  created_at =
                      created_at.astimezone(
                          timezone.utc
                      )


              except Exception as error:

                  # ------------------------------------------
                  # SAFETY:
                  # If createdAt cannot be understood,
                  # DO NOT DELETE THE notification.
                  # ------------------------------------------

                  print(
                      f"KEEP {notification_id} "
                      f"(invalid createdAt: {error})"
                  )

                  keep.append(match)

                  continue


              age =
                  now - created_at


              # ==================================================
              # EXPIRE ONLY AFTER A FULL 24 HOURS
              # ==================================================

              if age >= LIFETIME:

                  removed.append(
                      notification_id
                  )

                  print(
                      f"DELETE {notification_id} "
                      f"| age = {age}"
                  )

              else:

                  keep.append(match)

                  remaining =
                      LIFETIME - age

                  print(
                      f"KEEP {notification_id} "
                      f"| remaining ≈ {remaining}"
                  )


          # ==================================================
          # IF NOTHING EXPIRED
          # ==================================================

          if not removed:

              print("")
              print(
                  "Nothing expired."
              )

              raise SystemExit(0)


          # ==================================================
          # REBUILD FILE
          # ==================================================
          #
          # Remove only the expired objects.
          # Everything else stays.
          #
          # ==================================================

          new_text = text


          for match in reversed(matches):

              notification_id = match.group(1)

              if notification_id in removed:

                  start = match.start()
                  end = match.end()


                  # Remove the object itself.
                  new_text =
                      new_text[:start] +
                      new_text[end:]


          # ==================================================
          # CLEAN UP EXTRA COMMAS
          # ==================================================
          #
          # Prevent:
          #
          # {
          #   notification...
          # },
          #
          # followed by weird comma placement.
          #
          # ==================================================

          new_text = re.sub(
              r',\s*,',
              ',',
              new_text
          )


          # Remove comma immediately before ]
          new_text = re.sub(
              r',\s*\]',
              ']',
              new_text
          )


          # ==================================================
          # WRITE FILE
          # ==================================================

          with open(
              FILE,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(new_text)


          # ==================================================
          # SUMMARY
          # ==================================================

          print("")
          print("==============================================")
          print(" CLEANUP COMPLETE")
          print("==============================================")
          print(
              "Removed:",
              ", ".join(removed)
          )
          print(
              "Count:",
              len(removed)
          )
          print("")


          PY


      # ======================================================
      # CHECK WHETHER FILE CHANGED
      # ======================================================

      - name: Check for changes

        id: changes

        run: |

          if git diff --quiet -- notificationdata.js; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "No changes required."

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "Expired notifications were removed."

          fi


      # ======================================================
      # COMMIT CLEANUP
      # ======================================================

      - name: Commit expired notifications

        if: steps.changes.outputs.changed == 'true'

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add notificationdata.js


          git commit \
            -m "Auto-remove expired notifications"


          git push
