name: Expire Database Notifications

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expire-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Expire notifications older than 24 hours
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 10 --retry-all-errors \
            "https://sawantwadi-read-api.onrender.com/notifications" \
            --output /tmp/notifications.json
          node -e "const p=require('/tmp/notifications.json'); if(!p.success || !Array.isArray(p.notifications)) process.exit(1); console.log('Database notification endpoint healthy. Active notifications:', p.notifications.length)"
