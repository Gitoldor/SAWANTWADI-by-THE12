# ============================================================
# SAWANTWADI — AUTO EXPIRE NOTIFICATIONS
# ============================================================
#
# Deletes notifications only after they have completed
# a FULL 24 HOURS from their createdAt timestamp.
#
# Runs:
#   - Automatically every 12 hours
#   - Manually from GitHub Actions
#
# File:
#   notificationdata.js
#
# ============================================================

name: Expire Notifications


# ============================================================
# TRIGGERS
# ============================================================

on:

  # Run every 12 hours
  schedule:

    - cron: "0 */12 * * *"


  # Allow manual execution
  workflow_dispatch:


# ============================================================
# PERMISSIONS
# ============================================================

permissions:

  contents: write


# ============================================================
# JOB
# ============================================================

jobs:

  expire-notifications:

    runs-on: ubuntu-latest


    steps:


      # ======================================================
      # CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ======================================================
      # CHECK NOTIFICATIONS
      # ======================================================

      - name: Remove expired notifications

        run: |

          node <<'NODE'

          // ==================================================
          // CONFIGURATION
          // ==================================================

          const fs = require("fs");

          const FILE = "notificationdata.js";

          // A notification lives for exactly 24 hours.
          const LIFETIME = 24 * 60 * 60 * 1000;


          // ==================================================
          // CURRENT TIME
          // ==================================================

          const now = Date.now();


          console.log("");
          console.log("==========================================");
          console.log(" NOTIFICATION EXPIRATION");
          console.log("==========================================");
          console.log(
            "Current UTC:",
            new Date(now).toISOString()
          );
          console.log("");


          // ==================================================
          // READ notificationdata.js
          // ==================================================

          if (!fs.existsSync(FILE)) {

            console.error(
              "ERROR: notificationdata.js was not found."
            );

            process.exit(1);

          }


          let text =
            fs.readFileSync(
              FILE,
              "utf8"
            );


          // ==================================================
          // FIND NOTIFICATION OBJECTS
          // ==================================================
          //
          // Expected:
          //
          // {
          //   id:"n1",
          //   image:"...",
          //   title:"...",
          //   message:"...",
          //   link:"...",
          //   createdAt:"..."
          // }
          //
          // ==================================================

          const objectRegex =
            /\{\s*id\s*:\s*(["'])(.*?)\1\s*,[\s\S]*?createdAt\s*:\s*(["'])(.*?)\3\s*\}/g;


          const notifications = [];

          let match;


          while (
            (match = objectRegex.exec(text)) !== null
          ) {

            notifications.push({

              id: match[2],

              createdAt: match[4],

              start: match.index,

              end: objectRegex.lastIndex

            });

          }


          // ==================================================
          // NO NOTIFICATIONS
          // ==================================================

          if (notifications.length === 0) {

            console.log(
              "No notifications found."
            );

            process.exit(0);

          }


          // ==================================================
          // FIND EXPIRED NOTIFICATIONS
          // ==================================================

          const expired = [];

          const keep = [];


          for (
            const notification
            of notifications
          ) {


            // ------------------------------------------------
            // Parse createdAt
            // ------------------------------------------------

            const created =
              Date.parse(
                notification.createdAt
              );


            // ------------------------------------------------
            // SAFETY:
            // Invalid dates are NEVER deleted.
            // ------------------------------------------------

            if (
              Number.isNaN(created)
            ) {

              console.log(
                `KEEP ${notification.id} ` +
                `(invalid createdAt)`
              );

              keep.push(
                notification
              );

              continue;

            }


            // ------------------------------------------------
            // Calculate age
            // ------------------------------------------------

            const age =
              now - created;


            const ageHours =
              age /
              (60 * 60 * 1000);


            // ------------------------------------------------
            // FULL 24 HOURS COMPLETED
            // ------------------------------------------------

            if (
              age >= LIFETIME
            ) {

              console.log(
                `DELETE ${notification.id} ` +
                `(${ageHours.toFixed(2)} hours old)`
              );

              expired.push(
                notification
              );

            }


            // ------------------------------------------------
            // STILL ACTIVE
            // ------------------------------------------------

            else {

              const remaining =
                (
                  LIFETIME - age
                ) /
                (60 * 60 * 1000);


              console.log(
                `KEEP ${notification.id} ` +
                `(${remaining.toFixed(2)} hours remaining)`
              );


              keep.push(
                notification
              );

            }

          }


          // ==================================================
          // NOTHING TO DELETE
          // ==================================================

          if (
            expired.length === 0
          ) {

            console.log("");
            console.log(
              "Nothing has completed 24 hours."
            );
            console.log(
              "No file changes required."
            );
            console.log("");

            process.exit(0);

          }


          // ==================================================
          // REMOVE EXPIRED OBJECTS
          // ==================================================
          //
          // Work backwards so indexes remain correct.
          //
          // ==================================================

          for (
            let i =
              expired.length - 1;

            i >= 0;

            i--

          ) {

            const item =
              expired[i];


            // ----------------------------------------------
            // Determine removal boundaries
            // ----------------------------------------------

            let start =
              item.start;


            let end =
              item.end;


            // ----------------------------------------------
            // Remove a following comma if present
            // ----------------------------------------------

            while (
              end < text.length &&
              /\s/.test(text[end])
            ) {

              end++;

            }


            if (
              text[end] === ","
            ) {

              end++;

            }


            // ----------------------------------------------
            // Otherwise remove a preceding comma
            // ----------------------------------------------

            else {

              let before =
                start - 1;


              while (
                before >= 0 &&
                /\s/.test(text[before])
              ) {

                before--;

              }


              if (
                text[before] === ","
              ) {

                start =
                  before;

              }

            }


            // ----------------------------------------------
            // Delete object
            // ----------------------------------------------

            text =
              text.slice(0, start) +
              text.slice(end);

          }


          // ==================================================
          // CLEAN EXTRA BLANK LINES
          // ==================================================

          text =
            text.replace(
              /\n{3,}/g,
              "\n\n"
            );


          // ==================================================
          // WRITE UPDATED FILE
          // ==================================================

          fs.writeFileSync(
            FILE,
            text,
            "utf8"
          );


          // ==================================================
          // SUMMARY
          // ==================================================

          console.log("");
          console.log("==========================================");
          console.log(" CLEANUP COMPLETE");
          console.log("==========================================");

          console.log(
            "Deleted:",
            expired.map(
              n => n.id
            ).join(", ")
          );

          console.log(
            "Deleted count:",
            expired.length
          );

          console.log(
            "Remaining:",
            keep.length
          );

          console.log("");


          NODE


      # ======================================================
      # CHECK WHETHER FILE CHANGED
      # ======================================================

      - name: Check for changes

        id: changes

        run: |

          if git diff --quiet -- notificationdata.js; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "No changes detected."

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "notificationdata.js was changed."

          fi


      # ======================================================
      # COMMIT
      # ======================================================

      - name: Commit expired notifications

        if: steps.changes.outputs.changed == 'true'

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add notificationdata.js


          git commit \
            -m "Auto-remove expired notifications"


          git push