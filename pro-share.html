<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Sho1re1 PRO Sawantwadi user profile">
  <title>PRO profile · Sho1re1</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 18px;
      display: grid; place-items: center; color: #f7f7f7;
      background: radial-gradient(ellipse at 50% 5%, #252525 0, #111 38%, #070707 78%);
    }
    .page { width: min(100%, 430px); text-align: center; }
    .exit-row { display: flex; justify-content: flex-start; margin: 0 0 18px; }
    .exit-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 42px; padding: 0 16px; border: 1px solid rgba(255,255,255,.18);
      border-radius: 14px; color: #f5f5f5; background: rgba(255,255,255,.07);
      text-decoration: none; font-size: 13px; font-weight: 700;
      transition: background .18s ease, transform .18s ease;
    }
    .exit-button:active { transform: scale(.98); }
    .exit-button:hover { background: rgba(255,255,255,.13); }
    .eyebrow { color: #858585; font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; margin: 0 0 20px; }
    .card {
      position: relative; overflow: hidden; padding: 34px 24px 30px;
      border: 1px solid rgba(255,255,255,.13); border-radius: 30px;
      background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035));
      box-shadow: 0 28px 90px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    }
    .card:before {
      content: ""; position: absolute; width: 260px; height: 260px; border-radius: 50%;
      left: 50%; top: -190px; transform: translateX(-50%);
      background: rgba(255,255,255,.12); filter: blur(35px); pointer-events: none;
    }
    .pro-title { position: relative; margin: 0 0 27px; font-size: clamp(48px, 15vw, 66px); line-height: .95; letter-spacing: -.075em; font-weight: 900; }
    .avatar-wrap {
      width: 174px; height: 174px; margin: 0 auto 25px; padding: 5px;
      border-radius: 50%; background: linear-gradient(145deg,#fff,#777 55%,#292929);
      box-shadow: 0 12px 42px rgba(255,255,255,.13);
    }
    .avatar { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; background: #242424; }
    .name { margin: 0; font-size: 25px; font-weight: 750; letter-spacing: -.035em; overflow-wrap: anywhere; }
    .email { margin: 8px 0 0; color: #aaa; font-size: 14px; overflow-wrap: anywhere; }
    .claim { margin: 23px 0 0; color: #d5d5d5; font-size: 14px; line-height: 1.55; }
    .claim strong { color: #fff; font-weight: 750; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    button {
      min-height: 50px; border: 1px solid rgba(255,255,255,.2); border-radius: 16px;
      padding: 0 14px; color: #080808; background: #fff; font: inherit; font-size: 14px;
      font-weight: 750; cursor: pointer; transition: transform .18s ease, opacity .18s ease;
    }
    button.secondary { color: #f7f7f7; background: rgba(255,255,255,.08); }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .4; cursor: default; }
    .status { min-height: 20px; margin: 15px 4px 0; color: #aaa; font-size: 12px; line-height: 1.5; }
    .posts-section { margin-top: 26px; text-align: left; }
    .posts-heading { margin: 0 2px 13px; font-size: 17px; font-weight: 750; letter-spacing: -.035em; }
    .posts-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .post-card { display: block; min-width: 0; overflow: hidden; border: 1px solid rgba(255,255,255,.12); border-radius: 17px; color: #f7f7f7; background: rgba(255,255,255,.055); text-decoration: none; }
    .post-card img { display: block; width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #222; }
    .post-title { display: block; padding: 10px; font-size: 12px; line-height: 1.35; font-weight: 650; overflow-wrap: anywhere; }
    .posts-empty { grid-column: 1/-1; margin: 0; padding: 20px 12px; border: 1px solid rgba(255,255,255,.1); border-radius: 16px; color: #999; text-align: center; font-size: 12px; }
    .map-post-card { min-height: 100%; aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; border: 1px solid rgba(255,255,255,.2); border-radius: 17px; color: #fff; background: linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.045)); text-align: center; text-decoration: none; }
    .map-post-icon { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.25); border-radius: 15px; background: rgba(255,255,255,.1); font-size: 22px; }
    .map-post-label { font-size: 13px; line-height: 1.35; font-weight: 750; }
    .map-post-sub { color: #aaa; font-size: 10px; line-height: 1.4; }
    .footer { margin-top: 23px; color: #686868; font-size: 11px; letter-spacing: .04em; }
    .hidden { display: none !important; }
    @media (max-width: 360px) {
      .card { padding: 28px 17px 24px; border-radius: 25px; }
      .avatar-wrap { width: 150px; height: 150px; }
      .name { font-size: 22px; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="exit-row"><a class="exit-button" href="index.html" aria-label="Exit and return to home">← Exit</a></div>
    <p class="eyebrow" id="pageEyebrow">Share your PRO page</p>
    <section class="card hidden" id="profileCard" aria-label="Sho1re1 PRO profile">
      <h1 class="pro-title">PRO</h1>
      <div class="avatar-wrap">
        <img class="avatar" id="avatar" alt="Google profile photo">
      </div>
      <h2 class="name" id="displayName">Loading profile…</h2>
      <p class="email" id="email"></p>
      <p class="claim"><strong id="claimName">This user</strong> is a <strong>PRO Sawantwadi user</strong>.</p>
    </section>
    <section class="posts-section hidden" id="postsSection" aria-live="polite">
      <h2 class="posts-heading" id="postsHeading">Posts</h2>
      <div class="posts-grid" id="postsGrid"></div>
    </section>
    <div class="actions hidden" id="ownerActions">
      <button type="button" id="shareButton" disabled>Share</button>
      <button type="button" class="secondary" id="copyButton" disabled>Copy link</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="footer">LOCAL DISCOVERY. LOCAL PEOPLE. SHO1RE1.</p>
  </main>
  <script>
    (function () {
      "use strict";
      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const encodedProfile = params.get("profile");
      let shareUrl = "";

      function encodeProfile(profile) {
        const bytes = new TextEncoder().encode(JSON.stringify(profile));
        let binary = "";
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      }

      function decodeProfile(value) {
        const base64 = value.replace(/-/g, "+").replace(/_/g, "/");
        const padded = base64 + "=".repeat((4 - base64.length % 4) % 4);
        const binary = atob(padded);
        const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
        return JSON.parse(new TextDecoder().decode(bytes));
      }

      function setProfile(profile) {
        $("profileCard").classList.remove("hidden");
        const name = String(profile.name || "Sho1re1 user").trim().slice(0, 48);
        $("displayName").textContent = name || "Sho1re1 user";
        $("claimName").textContent = name || "This user";
        $("email").textContent = String(profile.email || "");
        if (profile.email) loadUserPosts(String(profile.email), name);
        $("avatar").src = profile.picture || "data:image/svg+xml," + encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#292929"/><circle cx="100" cy="75" r="38" fill="#777"/><path d="M25 200c5-48 34-72 75-72s70 24 75 72" fill="#777"/></svg>'
        );
      }

      async function loadUserPosts(email, name) {
        const section = $("postsSection");
        const grid = $("postsGrid");
        section.classList.remove("hidden");
        $("postsHeading").textContent = "Posts by " + (name || email);
        grid.replaceChildren();
        const empty = document.createElement("p");
        empty.className = "posts-empty";
        empty.textContent = "Loading posts…";
        grid.appendChild(empty);
        try {
          const response = await fetch("https://sawantwadi-read-api.onrender.com/posts-by-email?email=" + encodeURIComponent(email), {
            method: "GET",
            headers: { "Accept": "application/json" },
            cache: "no-store"
          });
          if (!response.ok) throw new Error("Posts could not be loaded");
          const data = await response.json();
          const posts = Array.isArray(data.places) ? data.places : [];
          const matches = posts.filter(post =>
            String(post.email || "").trim().toLowerCase() === String(email).trim().toLowerCase()
          );
          grid.replaceChildren();
          if (!matches.length) {
            empty.textContent = "No posts linked to this email yet.";
            grid.appendChild(empty);
            return;
          }
          const visiblePosts = matches.slice(0, 5);
          visiblePosts.forEach(post => {
            const rawLink = String(post.link || "").trim();
            let target = "";
            try {
              const parsed = new URL(rawLink, location.href);
              if (parsed.protocol === "https:" || parsed.protocol === "http:") target = parsed.href;
            } catch (_) {}
            const card = document.createElement("a");
            card.className = "post-card";
            card.href = target || "#";
            if (target) {
              card.target = "_blank";
              card.rel = "noopener noreferrer";
            } else {
              card.addEventListener("click", event => event.preventDefault());
              card.setAttribute("aria-disabled", "true");
            }
            const image = document.createElement("img");
            image.loading = "lazy";
            image.decoding = "async";
            image.alt = String(post.title || "Post");
            image.src = String(post.image || "");
            const title = document.createElement("span");
            title.className = "post-title";
            title.textContent = String(post.title || "Untitled post");
            card.append(image, title);
            grid.appendChild(card);
          });

          // The sixth tile opens every email-linked post on the main map.
          const payload = {
            v: 1,
            title: "Posts by " + (name || email),
            ids: matches.map(post => String(post.id)).filter(Boolean)
          };
          const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))))
            .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
          const mapUrl = new URL("index.html", location.href);
          mapUrl.search = "";
          mapUrl.searchParams.set("collection", encoded);

          const mapCard = document.createElement("a");
          mapCard.className = "map-post-card";
          mapCard.href = mapUrl.href;
          mapCard.innerHTML = '<span class="map-post-icon" aria-hidden="true">⌖</span><span class="map-post-label">Open posts in map</span><span class="map-post-sub">See all ' + matches.length + ' posts on the main map</span>';
          grid.appendChild(mapCard);
        } catch (_) {
          grid.replaceChildren();
          empty.textContent = "Posts are temporarily unavailable.";
          grid.appendChild(empty);
        }
      }

      function setStatus(message) {
        $("status").textContent = message || "";
      }

      function createOwnerPage() {
        let user = null;
        try {
          user = JSON.parse(localStorage.getItem("sho1re1_google_profile_v1") || "null");
        } catch (_) {}

        if (!user || !user.email) {
          $("displayName").textContent = "Sign in required";
          $("claimName").textContent = "This profile";
          setStatus("Sign in to your Google account in Sho1re1, then reopen this page.");
          return;
        }

        const name = String(user.displayName || user.googleName || user.email.split("@")[0]).trim();
        const profile = {
          name: name || user.email.split("@")[0],
          email: String(user.email),
          picture: String(user.picture || "")
        };
        setProfile(profile);
        $("ownerActions").classList.remove("hidden");

        const url = new URL("pro-share.html", location.href);
        url.search = "";
        url.searchParams.set("profile", encodeProfile(profile));
        shareUrl = url.href;
        $("shareButton").disabled = false;
        $("copyButton").disabled = false;
        setStatus("Your share link is ready.");
      }

      async function copyLink() {
        if (!shareUrl) return;
        try {
          await navigator.clipboard.writeText(shareUrl);
          setStatus("Link copied.");
        } catch (_) {
          const field = document.createElement("textarea");
          field.value = shareUrl;
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          try {
            document.execCommand("copy");
            setStatus("Link copied.");
          } catch (_) {
            setStatus("Copy isn't available here. Use Share instead.");
          }
          field.remove();
        }
      }

      $("copyButton").addEventListener("click", copyLink);
      $("shareButton").addEventListener("click", async function () {
        if (!shareUrl) return;
        if (navigator.share) {
          try {
            await navigator.share({
              title: "My Sho1re1 PRO profile",
              text: "I'm a PRO Sawantwadi user on Sho1re1.",
              url: shareUrl
            });
          } catch (error) {
            if (error && error.name !== "AbortError") {
              setStatus("Sharing wasn't available. You can copy the link instead.");
            }
          }
        } else {
          await copyLink();
        }
      });

      if (encodedProfile) {
        $("pageEyebrow").textContent = "Sho1re1 · Sawantwadi";
        $("ownerActions").classList.add("hidden");
        try {
          const profile = decodeProfile(encodedProfile);
          if (!profile || typeof profile.email !== "string" || typeof profile.name !== "string") {
            throw new Error("Invalid profile data");
          }
          setProfile(profile);
          setStatus("");
        } catch (_) {
          $("displayName").textContent = "Invalid profile link";
          $("claimName").textContent = "This profile";
          setStatus("The profile information in this link could not be read.");
        }
      } else {
        $("pageEyebrow").textContent = "Share your PRO page";
        createOwnerPage();
      }
    })();
  </script>
</body>
</html>
