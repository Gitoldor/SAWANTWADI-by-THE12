<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Saved Collections</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    width: 100%;
    height: 100vh;
    background: #ffffff;
    color: #111111;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 24px 16px 40px;
    scrollbar-width: none;
  }

  body::-webkit-scrollbar {
    display: none;
  }

  /* Header Bar */
  .header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .nav-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .back-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
    text-decoration: none;
    flex-shrink: 0;
  }

  .back-btn svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: #111111;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .main-title {
    font-size: 1.85rem;
    font-weight: 900;
    letter-spacing: -0.6px;
    color: #111111;
    line-height: 1.1;
  }

  .action-btn {
    background: #111111;
    color: #ffffff;
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.12s ease;
  }

  .action-btn:active {
    transform: scale(0.95);
  }

  /* 2x2 GRID CONTAINERS */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  /* Folder Cards */
  .folder-card {
    aspect-ratio: 1;
    background: #f4f4f6;
    border: 1px solid #e2e2e8;
    border-radius: 36px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.2s ease;
  }

  .folder-card:active {
    transform: scale(0.96);
  }

  .folder-card-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.55;
    z-index: 1;
  }

  .folder-card-content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .folder-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .folder-card-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.85);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .folder-card-icon svg {
    width: 20px;
    height: 20px;
    fill: #111111;
  }

  .edit-folder-btn {
    background: rgba(255, 255, 255, 0.85);
    border: none;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(4px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  .edit-folder-btn svg {
    width: 15px;
    height: 15px;
    stroke: #111111;
    fill: none;
    stroke-width: 2;
  }

  .folder-card-info {
    display: flex;
    flex-direction: column;
  }

  .folder-card-name {
    color: #111111;
    font-weight: 800;
    font-size: 1.05rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .folder-card-count {
    color: #555555;
    font-size: 0.8rem;
    font-weight: 700;
    margin-top: 2px;
  }

  /* Full Image Card Inside Folder */
  .place-card-full {
    aspect-ratio: 1;
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    background: #f4f4f6;
    border: 1px solid #e2e2e8;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .place-card-full:active {
    transform: scale(0.96);
  }

  .place-card-full img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .place-card-full::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.1) 65%, transparent 100%);
    z-index: 1;
  }

  .place-overlay-info {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 14px;
    z-index: 2;
    display: flex;
    flex-direction: column;
  }

  .place-title-overlay {
    font-size: 0.95rem;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.2;
    word-break: break-word;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
  }

  .place-type-overlay {
    font-size: 0.72rem;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.85);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  .empty-state {
    text-align: center;
    color: #888888;
    font-size: 0.95rem;
    font-weight: 600;
    margin-top: 60px;
    grid-column: span 2;
  }

  /* EDIT / CREATE FOLDER MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-card {
    background: #ffffff;
    width: 100%;
    max-width: 340px;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .modal-title {
    font-size: 1.2rem;
    font-weight: 800;
  }

  .modal-input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid #e2e2e8;
    background: #f8f8fa;
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
  }

  .modal-input:focus {
    border-color: #111111;
  }

  /* FILE UPLOAD FIELD STYLING */
  .file-upload-box {
    border: 2px dashed #d0d0d8;
    border-radius: 14px;
    height: 100px;
    background: #f8f8fa;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s ease;
  }

  .file-upload-box:hover {
    border-color: #111111;
  }

  .file-upload-box input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .file-upload-label {
    font-size: 0.8rem;
    font-weight: 700;
    color: #666666;
    pointer-events: none;
  }

  .file-upload-preview {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 6px;
  }

  .modal-btn {
    border: none;
    padding: 8px 16px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .modal-btn-cancel {
    background: #f0f0f2;
    color: #444;
  }

  .modal-btn-save {
    background: #111111;
    color: #ffffff;
  }
</style>
</head>
<body>

  <!-- Top Navigation Header -->
  <div class="header-bar">
    <div class="nav-left">
      <button class="back-btn" id="backBtn" onclick="handleBackNavigation()">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="main-title" id="pageTitle">Saved</h1>
    </div>
    <button class="action-btn" id="actionBtn" onclick="openFolderModal()">+ New</button>
  </div>

  <!-- View 1: 2x2 Grid of Folders -->
  <div class="grid-container" id="foldersGrid"></div>

  <!-- View 2: 2x2 Grid of Full-Image Posts -->
  <div class="grid-container" id="postsFeed" style="display: none;"></div>

  <!-- Edit / Create Modal -->
  <div class="modal-overlay" id="folderModal">
    <div class="modal-card">
      <div class="modal-title" id="modalHeading">Create Folder</div>
      <input type="text" id="modalFolderName" class="modal-input" placeholder="Folder Title" />
      
      <!-- Upload Cover Box -->
      <div class="file-upload-box" id="uploadBox">
        <span class="file-upload-label" id="uploadText">+ Upload Cover Image</span>
        <img id="uploadPreview" class="file-upload-preview" alt="Preview" />
        <input type="file" id="coverFileInput" accept="image/*" onchange="handleImageSelection(event)" />
      </div>

      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" onclick="closeFolderModal()">Cancel</button>
        <button class="modal-btn modal-btn-save" onclick="saveFolderModal()">Save</button>
      </div>
    </div>
  </div>

<!-- Ensure app.js is loaded so appPostsList is available -->
<script src="app.js"></script>

<script>
  /* MATCHING MAP DB CONFIG */
  const DB_NAME = 'Sho1re1DB_v4';
  const STORE_PLACES = 'saved_places';
  const STORE_FOLDERS = 'custom_folders';
  let db = null;

  let allSavedPlaces = [];
  let allFolders = [];
  let currentEditingFolder = null;
  let activeCoverBase64 = '';

  // Open IndexedDB Connection
  function initDB() {
    const request = indexedDB.open(DB_NAME, 1);

    request.onupgradeneeded = (e) => {
      const dbInstance = e.target.result;
      if (!dbInstance.objectStoreNames.contains(STORE_PLACES)) {
        dbInstance.createObjectStore(STORE_PLACES, { keyPath: 'id' });
      }
      if (!dbInstance.objectStoreNames.contains(STORE_FOLDERS)) {
        dbInstance.createObjectStore(STORE_FOLDERS, { keyPath: 'name' });
      }
    };

    request.onsuccess = (e) => {
      db = e.target.result;
      loadDataFromDB();
    };

    request.onerror = (e) => {
      console.error("Database connection error:", e.target.error);
    };
  }

  // Load Saved Places & Custom Folders
  function loadDataFromDB() {
    if (!db) return;

    const tx = db.transaction([STORE_PLACES, STORE_FOLDERS], 'readonly');
    const placeStore = tx.objectStore(STORE_PLACES);
    const folderStore = tx.objectStore(STORE_FOLDERS);

    const placesReq = placeStore.getAll();
    const foldersReq = folderStore.getAll();

    tx.oncomplete = () => {
      const rawPlaces = placesReq.result || [];
      allFolders = foldersReq.result || [];

      // Scan app.js post list: Verify by both ID and Title/Name
      allSavedPlaces = rawPlaces.filter(place => {
        if (typeof appPostsList !== 'undefined') {
          if (Array.isArray(appPostsList)) {
            return appPostsList.some(post => 
              (post.id && post.id === place.id) || 
              (post.title && place.title && post.title.toLowerCase() === place.title.toLowerCase()) ||
              (post.name && place.name && post.name.toLowerCase() === place.name.toLowerCase()) ||
              (post.name && place.title && post.name.toLowerCase() === place.title.toLowerCase())
            );
          }
          
          // Object lookup fallback
          if (typeof appPostsList === 'object' && appPostsList !== null) {
            if (place.id && Object.prototype.hasOwnProperty.call(appPostsList, place.id)) {
              return true;
            }
            return Object.values(appPostsList).some(post => 
              (post.title && place.title && post.title.toLowerCase() === place.title.toLowerCase()) ||
              (post.name && place.name && post.name.toLowerCase() === place.name.toLowerCase())
            );
          }
        }
        return true; // Fallback if appPostsList is missing
      });

      if (!allFolders.some(f => f.name === 'Default')) {
        allFolders.unshift({ name: 'Default', cover: '' });
      }

      renderFolderGrid();
    };
  }

  // Render 2x2 Folder Grid
  function renderFolderGrid() {
    const grid = document.getElementById('foldersGrid');
    grid.innerHTML = '';

    allFolders.forEach(folderObj => {
      const matchingItems = allSavedPlaces.filter(place => 
        place.folders && place.folders.includes(folderObj.name)
      );

      const card = document.createElement('div');
      card.className = 'folder-card';
      card.onclick = () => openFolder(folderObj.name, matchingItems);

      const coverUrl = folderObj.cover || (matchingItems[0] ? matchingItems[0].image : '');
      const bgImgHTML = coverUrl ? `<img src="${coverUrl}" class="folder-card-bg" alt="" />` : '';

      card.innerHTML = `
        ${bgImgHTML}
        <div class="folder-card-content">
          <div class="folder-card-top">
            <div class="folder-card-icon">
              <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
            </div>
            <button class="edit-folder-btn" onclick="event.stopPropagation(); openFolderModal('${folderObj.name}')">
              <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
          </div>
          <div class="folder-card-info">
            <div class="folder-card-name">${folderObj.name}</div>
            <div class="folder-card-count">${matchingItems.length} ${matchingItems.length === 1 ? 'item' : 'items'}</div>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // Open Selected Folder & Render 2x2 Full Image Posts
  function openFolder(folderName, items) {
    document.getElementById('foldersGrid').style.display = 'none';
    document.getElementById('postsFeed').style.display = 'grid';
    document.getElementById('actionBtn').style.display = 'none';
    document.getElementById('pageTitle').innerText = folderName;

    const feed = document.getElementById('postsFeed');
    feed.innerHTML = '';

    if (items.length === 0) {
      feed.innerHTML = '<div class="empty-state">No saved items in this folder.</div>';
      return;
    }

    items.forEach(place => {
      const card = document.createElement('div');
      card.className = 'place-card-full';
      
      const imgHTML = place.image ? `<img src="${place.image}" alt="${place.title || place.name || 'Place'}" />` : '';
      const typeHTML = place.type ? `<div class="place-type-overlay">${place.type}</div>` : '';

      card.innerHTML = `
        ${imgHTML}
        <div class="place-overlay-info">
          <div class="place-title-overlay">${place.title || place.name || place.id || 'Saved Place'}</div>
          ${typeHTML}
        </div>
      `;
      feed.appendChild(card);
    });
  }

  // Handle Local File Selection & Convert to Base64
  function handleImageSelection(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      activeCoverBase64 = e.target.result;
      const preview = document.getElementById('uploadPreview');
      preview.src = activeCoverBase64;
      preview.style.display = 'block';
      document.getElementById('uploadText').style.display = 'none';
    };
    reader.readAsDataURL(file);
  }

  // Modal Functions for Creating/Editing Folders
  function openFolderModal(folderName = null) {
    currentEditingFolder = folderName;
    const modal = document.getElementById('folderModal');
    const heading = document.getElementById('modalHeading');
    const nameInput = document.getElementById('modalFolderName');
    const preview = document.getElementById('uploadPreview');
    const uploadText = document.getElementById('uploadText');

    document.getElementById('coverFileInput').value = '';

    if (folderName) {
      const folderObj = allFolders.find(f => f.name === folderName);
      heading.innerText = 'Edit Folder';
      nameInput.value = folderObj ? folderObj.name : folderName;
      activeCoverBase64 = folderObj ? (folderObj.cover || '') : '';
    } else {
      heading.innerText = 'New Folder';
      nameInput.value = '';
      activeCoverBase64 = '';
    }

    if (activeCoverBase64) {
      preview.src = activeCoverBase64;
      preview.style.display = 'block';
      uploadText.style.display = 'none';
    } else {
      preview.style.display = 'none';
      uploadText.style.display = 'block';
    }

    modal.style.display = 'flex';
  }

  function closeFolderModal() {
    document.getElementById('folderModal').style.display = 'none';
  }

  function saveFolderModal() {
    const nameInput = document.getElementById('modalFolderName').value.trim();

    if (!nameInput) return;

    if (db) {
      const tx = db.transaction(STORE_FOLDERS, 'readwrite');
      const store = tx.objectStore(STORE_FOLDERS);

      if (currentEditingFolder && currentEditingFolder !== nameInput) {
        store.delete(currentEditingFolder);
      }

      store.put({
        name: nameInput,
        cover: activeCoverBase64
      });

      tx.oncomplete = () => {
        closeFolderModal();
        loadDataFromDB();
      };
    }
  }

  // Smart back navigation handler
  function handleBackNavigation() {
    const postsFeed = document.getElementById('postsFeed');
    if (postsFeed.style.display === 'grid') {
      showFolderGrid();
    } else {
      window.location.href = 'index.html';
    }
  }

  // Return to 2x2 Folder View
  function showFolderGrid() {
    document.getElementById('postsFeed').style.display = 'none';
    document.getElementById('foldersGrid').style.display = 'grid';
    document.getElementById('actionBtn').style.display = 'block';
    document.getElementById('pageTitle').innerText = 'Saved';
    loadDataFromDB();
  }

  // Initialize DB on page load
  window.addEventListener('DOMContentLoaded', initDB);
</script>

</body>
</html>
