<script>
/* Sho1re1: disable and clear legacy offline service-worker caches. */
(async () => {
  try {
    if ("serviceWorker" in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(registration => registration.unregister()));
    }
    if ("caches" in window) {
      const names = await caches.keys();
      await Promise.all(names
        .filter(name => name.startsWith("sho1re1-") || name === "my-app-v1")
        .map(name => caches.delete(name)));
    }
  } catch (error) {
    console.warn("Offline cache cleanup could not complete:", error);
  }
})();
</script>

<script>
  /* MATCHING MAP DB CONFIG */
  const DB_NAME = 'Sho1re1DB_v4';
  const STORE_PLACES = 'saved_places';
  const STORE_FOLDERS = 'custom_folders';
  let db = null;

  let allSavedPlaces = [];
  let allFolders = [];
  let currentEditingFolder = null;
  let activeCoverBase64 = '';

  // Open IndexedDB Connection
  function initDB() {
    const request = indexedDB.open(DB_NAME, 1);

    request.onupgradeneeded = (e) => {
      const dbInstance = e.target.result;
      if (!dbInstance.objectStoreNames.contains(STORE_PLACES)) {
        dbInstance.createObjectStore(STORE_PLACES, { keyPath: 'id' });
      }
      if (!dbInstance.objectStoreNames.contains(STORE_FOLDERS)) {
        dbInstance.createObjectStore(STORE_FOLDERS, { keyPath: 'name' });
      }
    };

    request.onsuccess = (e) => {
      db = e.target.result;
      loadDataFromDB();
    };

    request.onerror = (e) => {
      console.error("Database connection error:", e.target.error);
    };
  }

  // Load Saved Places & Custom Folders
  function loadDataFromDB() {
    if (!db) return;

    const tx = db.transaction([STORE_PLACES, STORE_FOLDERS], 'readwrite');
    const placeStore = tx.objectStore(STORE_PLACES);
    const folderStore = tx.objectStore(STORE_FOLDERS);

    const placesReq = placeStore.getAll();
    const foldersReq = folderStore.getAll();
    let liveIds = null;

    // app.js is the source of truth. Match by stable post ID only:
    // titles/names are not unique and can accidentally preserve deleted posts.
    if (Array.isArray(window.Sho1re1Places)) {
      liveIds = new Set(window.Sho1re1Places.map(post => String(post.id)));
    }

    placesReq.onsuccess = () => {
      const stored = placesReq.result || [];
      if (liveIds) {
        stored.forEach(place => {
          if (!liveIds.has(String(place.id))) {
            placeStore.delete(place.id);
          }
        });
        allSavedPlaces = stored.filter(place => liveIds.has(String(place.id)));
      } else {
        // If the source list failed to load, keep saved data rather than deleting it.
        allSavedPlaces = stored;
      }
    };

    tx.oncomplete = () => {
      allFolders = foldersReq.result || [];

      if (!allFolders.some(f => f.name === 'Default')) {
        allFolders.unshift({ name: 'Default', cover: '' });
      }

      renderFolderGrid();
    };
  }

  // Render 2x2 Folder Grid
  function renderFolderGrid() {
    const grid = document.getElementById('foldersGrid');
    grid.innerHTML = '';

    allFolders.forEach(folderObj => {
      const matchingItems = allSavedPlaces.filter(place => 
        place.folders && place.folders.includes(folderObj.name)
      );

      const card = document.createElement('div');
      card.className = 'folder-card';
      card.onclick = () => openFolder(folderObj.name, matchingItems);

      const coverUrl = folderObj.cover || (matchingItems[0] ? matchingItems[0].image : '');
      const bgImgHTML = coverUrl ? `<img src="${coverUrl}" class="folder-card-bg" alt="" />` : '';

      card.innerHTML = `
        ${bgImgHTML}
        <div class="folder-card-content">
          <div class="folder-card-top">
            <div class="folder-card-icon">
              <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
            </div>
            <button class="edit-folder-btn" onclick="event.stopPropagation(); openFolderModal('${folderObj.name}')">
              <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
          </div>
          <div class="folder-card-info">
            <div class="folder-card-name">${folderObj.name}</div>
            <div class="folder-card-count">${matchingItems.length} ${matchingItems.length === 1 ? 'item' : 'items'}</div>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  let currentFolderName = null;
  let currentFolderItems = [];
  let sharedCollectionMode = false;
  let sharedCollectionMap = null;
  let sharedCollectionView = "map";

  // Create a portable link containing post IDs, not local IndexedDB data.
  // Anyone opening it resolves those IDs against the current public app.js dataset.
  function shareCurrentFolder() {
    if (!currentFolderName || !currentFolderItems.length) {
      alert('This collection has no posts to share yet.');
      return;
    }

    const payload = {
      v: 1,
      title: currentFolderName,
      ids: currentFolderItems.map(place => String(place.id))
    };
    const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))))
      .replaceAll('+', '-').replaceAll('/', '_').replace(/=+$/g, '');
    const url = new URL('index.html', window.location.href);
    url.search = '';
    url.searchParams.set('collection', encoded);
    const shareUrl = url.toString();

    if (navigator.share) {
      navigator.share({ title: currentFolderName + ' · Sho1re1', text: 'Check out this Sho1re1 collection', url: shareUrl })
        .catch(error => {
          if (error && error.name !== 'AbortError') copyCollectionLink(shareUrl);
        });
    } else {
      copyCollectionLink(shareUrl);
    }
  }

  function copyCollectionLink(url) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(
        () => alert('Collection link copied!'),
        () => prompt('Copy your collection link:', url)
      );
    } else {
      prompt('Copy your collection link:', url);
    }
  }

  function loadSharedCollection() {
    const encoded = new URLSearchParams(window.location.search).get('collection');
    if (!encoded || !Array.isArray(window.Sho1re1Places)) return false;

    try {
      const normalized = encoded.replace(/-/g, '+').replace(/_/g, '/');
      const json = decodeURIComponent(escape(atob(normalized)));
      const payload = JSON.parse(json);
      if (!payload || payload.v !== 1 || !Array.isArray(payload.ids)) throw new Error('Invalid collection');

      const wanted = new Set(payload.ids.map(String));
      const items = window.Sho1re1Places.filter(place => wanted.has(String(place.id)));
      sharedCollectionMode = true;
      document.getElementById('foldersGrid').style.display = 'none';
      document.getElementById('actionBtn').style.display = 'none';
      document.getElementById('shareFolderBtn').style.display = 'none';
      document.getElementById('pageTitle').innerText = payload.title || 'Shared Collection';
      document.getElementById('backBtn').onclick = () => {
        window.location.href = 'saved.html';
      };
      openFolder(payload.title || 'Shared Collection', items);
      document.getElementById('sharedViewToggle').style.display = 'inline-block';
      showSharedCollectionMap(items);
      return true;
    } catch (error) {
      console.warn('Shared collection link is invalid:', error);
      document.getElementById('pageTitle').innerText = 'Collection unavailable';
      document.getElementById('foldersGrid').style.display = 'none';
      document.getElementById('postsFeed').style.display = 'grid';
      document.getElementById('postsFeed').innerHTML = '<div class="empty-state">This collection link is invalid or outdated.</div>';
      document.getElementById('actionBtn').style.display = 'none';
      return true;
    }
  }

  function showSharedCollectionMap(items) {
    const mapEl = document.getElementById('sharedMap');
    const feed = document.getElementById('postsFeed');
    feed.style.display = 'none';
    mapEl.style.display = 'block';
    sharedCollectionView = 'map';
    document.getElementById('sharedViewToggle').innerText = 'Grid';

    if (!window.L) {
      mapEl.innerHTML = '<div style="padding:24px;color:#555;">Map could not load. Switch to Grid to view this collection.</div>';
      return;
    }

    const located = items.filter(place =>
      Number.isFinite(Number(place.lat)) && Number.isFinite(Number(place.lng)) &&
      Number(place.lat) >= -90 && Number(place.lat) <= 90 &&
      Number(place.lng) >= -180 && Number(place.lng) <= 180
    );

    if (sharedCollectionMap) { sharedCollectionMap.remove(); sharedCollectionMap = null; }
    mapEl.innerHTML = '';
    sharedCollectionMap = L.map(mapEl, { zoomControl: true, scrollWheelZoom: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(sharedCollectionMap);

    if (!located.length) {
      sharedCollectionMap.setView([15.913, 73.821], 13);
      mapEl.insertAdjacentHTML('beforeend', '<div style="position:absolute;z-index:500;bottom:14px;left:50%;transform:translateX(-50%);background:#fff;padding:9px 13px;border-radius:14px;font-size:12px;box-shadow:0 2px 12px #0002;white-space:nowrap;">No mapped locations in this collection</div>');
      return;
    }

    const bounds = [];
    located.forEach(place => {
      const lat = Number(place.lat), lng = Number(place.lng);
      bounds.push([lat, lng]);
      const title = String(place.title || place.name || 'Saved place');
      const type = String(place.type || place.topic || '');
      const image = place.image ? '<img src="' + String(place.image).replace(/"/g, '&quot;') + '" alt="">' : '';
      const safeTitle = title.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const safeType = type.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const popup = '<div class="shared-map-popup">' + image + '<strong>' + safeTitle + '</strong><span>' + safeType + '</span></div>';
      L.marker([lat, lng]).addTo(sharedCollectionMap).bindPopup(popup);
    });
    sharedCollectionMap.fitBounds(bounds, { padding: [35, 35], maxZoom: 16 });
    setTimeout(() => sharedCollectionMap && sharedCollectionMap.invalidateSize(), 80);
  }

  function toggleSharedCollectionView() {
    if (!sharedCollectionMode) return;
    const mapEl = document.getElementById('sharedMap');
    const feed = document.getElementById('postsFeed');
    if (sharedCollectionView === 'map') {
      mapEl.style.display = 'none';
      feed.style.display = 'grid';
      sharedCollectionView = 'grid';
      document.getElementById('sharedViewToggle').innerText = 'Map';
    } else {
      showSharedCollectionMap(currentFolderItems);
    }
  }

  // Open Selected Folder & Render 2x2 Full Image Posts
  function openFolder(folderName, items) {
    currentFolderName = folderName;
    currentFolderItems = items.slice();
    document.getElementById('shareFolderBtn').style.display =
      (!sharedCollectionMode && items.length) ? 'inline-block' : 'none';
    document.getElementById('foldersGrid').style.display = 'none';
    document.getElementById('postsFeed').style.display = 'grid';
    document.getElementById('actionBtn').style.display = 'none';
    document.getElementById('pageTitle').innerText = folderName;

    const feed = document.getElementById('postsFeed');
    feed.innerHTML = '';

    if (items.length === 0) {
      feed.innerHTML = '<div class="empty-state">No saved items in this folder.</div>';
      return;
    }

    items.forEach(place => {
      const card = document.createElement('div');
      card.className = 'place-card-full';
      
      const imgHTML = place.image ? `<img src="${place.image}" alt="${place.title || place.name || 'Place'}" />` : '';
      const typeHTML = place.type ? `<div class="place-type-overlay">${place.type}</div>` : '';

      card.innerHTML = `
        ${imgHTML}
        <div class="place-overlay-info">
          <div class="place-title-overlay">${place.title || place.name || place.id || 'Saved Place'}</div>
          ${typeHTML}
        </div>
      `;
      feed.appendChild(card);
    });
  }

  // Handle Local File Selection & Convert to Base64
  function handleImageSelection(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      activeCoverBase64 = e.target.result;
      const preview = document.getElementById('uploadPreview');
      preview.src = activeCoverBase64;
      preview.style.display = 'block';
      document.getElementById('uploadText').style.display = 'none';
    };
    reader.readAsDataURL(file);
  }

  // Modal Functions for Creating/Editing Folders
  function openFolderModal(folderName = null) {
    currentEditingFolder = folderName;
    const modal = document.getElementById('folderModal');
    const heading = document.getElementById('modalHeading');
    const nameInput = document.getElementById('modalFolderName');
    const preview = document.getElementById('uploadPreview');
    const uploadText = document.getElementById('uploadText');

    document.getElementById('coverFileInput').value = '';

    if (folderName) {
      const folderObj = allFolders.find(f => f.name === folderName);
      heading.innerText = 'Edit Folder';
      nameInput.value = folderObj ? folderObj.name : folderName;
      activeCoverBase64 = folderObj ? (folderObj.cover || '') : '';
    } else {
      heading.innerText = 'New Folder';
      nameInput.value = '';
      activeCoverBase64 = '';
    }

    if (activeCoverBase64) {
      preview.src = activeCoverBase64;
      preview.style.display = 'block';
      uploadText.style.display = 'none';
    } else {
      preview.style.display = 'none';
      uploadText.style.display = 'block';
    }

    modal.style.display = 'flex';
  }

  function closeFolderModal() {
    document.getElementById('folderModal').style.display = 'none';
  }

  function saveFolderModal() {
    const nameInput = document.getElementById('modalFolderName').value.trim();

    if (!nameInput) return;

    if (db) {
      const tx = db.transaction(STORE_FOLDERS, 'readwrite');
      const store = tx.objectStore(STORE_FOLDERS);

      if (currentEditingFolder && currentEditingFolder !== nameInput) {
        store.delete(currentEditingFolder);
      }

      store.put({
        name: nameInput,
        cover: activeCoverBase64
      });

      tx.oncomplete = () => {
        closeFolderModal();
        loadDataFromDB();
      };
    }
  }

  // Smart back navigation handler
  function handleBackNavigation() {
    const postsFeed = document.getElementById('postsFeed');
    if (postsFeed.style.display === 'grid') {
      showFolderGrid();
    } else {
      window.location.href = 'index.html';
    }
  }

  // Return to 2x2 Folder View
  function showFolderGrid() {
    if (sharedCollectionMode) { window.location.href = 'saved.html'; return; }
    document.getElementById('sharedMap').style.display = 'none';
    document.getElementById('sharedViewToggle').style.display = 'none';
    document.getElementById('postsFeed').style.display = 'none';
    document.getElementById('foldersGrid').style.display = 'grid';
    document.getElementById('actionBtn').style.display = 'block';
    document.getElementById('pageTitle').innerText = 'Saved';
    loadDataFromDB();
  }

  // Initialize shared links without touching the viewer's private IndexedDB.
  // Normal saved collections continue to load from the owner's local database.
  window.addEventListener('DOMContentLoaded', () => {
    if (!loadSharedCollection()) initDB();
  });
</script>
