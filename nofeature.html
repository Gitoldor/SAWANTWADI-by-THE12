<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feature Not Yet Available</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-main: #09090b;
      --text-muted: #52525b;
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      padding: 24px;
    }

    /* Ambient background gradient pulsing to make the UI feel alive */
    .bg-pulse {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(255,255,255,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      animation: pulseGlow 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Floating container for dynamic 3D depth */
    .image-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 32px;
      perspective: 1000px;
      animation: floatIdle 3s ease-in-out infinite alternate;
    }

    @keyframes floatIdle {
      0% { translateY(0px); }
      100% { translateY(-8px); }
    }

    .gyro-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 32px;
      border: 2px solid rgba(0, 0, 0, 0.05);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 25px var(--accent-glow);
      will-change: transform;
      transition: transform 0.08s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Bold, high-impact text hierarchy */
    h1 {
      font-size: 2.25rem;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.04em;
      color: var(--text-main);
      margin-bottom: 12px;
      text-transform: capitalize;
    }

    h1 span {
      background: linear-gradient(135deg, #09090b 0%, #2563eb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.125rem;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 32px;
    }

    /* Alive button design with scale & shadow pop */
    .enable-btn {
      position: relative;
      background-color: var(--text-main);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(9, 9, 11, 0.3);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .enable-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.4);
      background-color: var(--accent);
    }

    .enable-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- Ambient background lighting -->
  <div class="bg-pulse"></div>

  <div class="container">
    <div class="image-wrapper">
      <img 
        id="target-image"
        class="gyro-image" 
        src="https://i.ibb.co/Mxxgy42n/SAWANT-WADI-20260830-162115-0000.png" 
        alt="Feature Icon"
      />
    </div>

    <!-- Bold, High-Impact Messaging -->
    <h1><span>This Feature Is Not Yet Available</span></h1>
    <p>Coming soon in upcoming updates 🔥</p>

    <!-- Interactive Button -->
    <button id="gyro-btn" class="enable-btn">
      Click me 😁
    </button>
  </div>

  <script>
    const targetImage = document.getElementById('target-image');
    const gyroBtn = document.getElementById('gyro-btn');

    // Motion parameters for maximum response
    const maxTranslate = 140; 
    const maxRotate = 50;     

    function updateImagePosition(tiltX, tiltY) {
      const clampedX = Math.max(-45, Math.min(45, tiltX));
      const clampedY = Math.max(-45, Math.min(45, tiltY));

      const translateX = (clampedY / 45) * maxTranslate;
      const translateY = (clampedX / 45) * maxTranslate;
      const rotateX = -(clampedX / 45) * maxRotate;
      const rotateY = (clampedY / 45) * maxRotate;

      targetImage.style.transform = 
        `translate3d(${translateX}px, ${translateY}px, 0) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.15)`;
    }

    function handleOrientation(event) {
      const beta = event.beta || 0;
      const gamma = event.gamma || 0;

      updateImagePosition(beta, gamma);
    }

    async function initGyroscope() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const response = await DeviceOrientationEvent.requestPermission();
          if (response === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            gyroBtn.style.display = 'none';
          } else {
            alert('Sensor permission rejected.');
          }
        } catch (error) {
          console.error('Error requesting orientation permission:', error);
        }
      } else if ('DeviceOrientationEvent' in window) {
        window.addEventListener('deviceorientation', handleOrientation);
        gyroBtn.style.display = 'none';
      } else {
        gyroBtn.innerText = 'Gyroscope Not Supported';
      }
    }

    gyroBtn.addEventListener('click', initGyroscope);

    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission !== 'function') {
      window.addEventListener('deviceorientation', handleOrientation);
      gyroBtn.style.display = 'none';
    }

    // Interactive mouse fallback for desktop testing
    window.addEventListener('mousemove', (e) => {
      if (window.innerWidth > 768) {
        const mouseX = (e.clientX / window.innerWidth - 0.5) * 90;
        const mouseY = (e.clientY / window.innerHeight - 0.5) * 90;
        updateImagePosition(mouseY, mouseX);
      }
    });
  </script>
</body>
</html>
